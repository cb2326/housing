<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f3f4f6; --line: #e5e7eb; --text: #111827; --muted: #6b7280;
    --accent: #126b60; --accent-soft: #e6f4f1; --warm: #f59e0b;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -10px rgba(16, 24, 40, .18);
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", "Noto Sans Armenian", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --hy: "Noto Sans Armenian", "Inter", system-ui, sans-serif;
    --na: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100dvh; }

  /* sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px; text-decoration: none; color: inherit; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 { margin: 0; font: 600 21px/1.1 var(--display); }
  .brand small { display: block; color: var(--muted); font: 12px var(--sans); margin-top: 2px; }
  .country { display: flex; gap: 6px; margin: 6px 14px 10px; }
  .country a, .country span { flex: 1; text-align: center; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); font-weight: 600; font-size: 12.5px; text-decoration: none; color: var(--muted); }
  .country span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .country a:hover { border-color: #8ccdc0; color: var(--accent); }
  .brand .byline { color: var(--accent); font-weight: 600; font-size: 12.5px; margin-top: 3px; }
  /* data points: the same collapsible groups as the US map */
  .dp-search { margin: 4px 14px 10px; position: relative; display: block; }
  .dp-search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .dp-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .groups { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
  .group { border-top: 1px solid var(--line); }
  .group > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 12px 8px; cursor: pointer; font-weight: 600; text-align: left; }
  .group > button::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
  .group.open > button::after { transform: rotate(-135deg); }
  .group > button span { display: inline-flex; align-items: center; gap: 8px; }
  .group ul { list-style: none; margin: 0 0 8px; padding: 0; display: none; }
  .group.open ul { display: block; }
  .gi { width: 17px; height: 17px; color: var(--accent); flex: none; }
  .group .dot { width: 7px; height: 7px; border-radius: 50%; background: #e76f51; display: inline-block; }
  .metric { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .metric:hover { background: var(--accent-soft); }
  .metric input { accent-color: var(--accent); margin: 0; flex: none; }
  .metric span { flex: 1; }
  .metric.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .metric .info { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font: 600 11px/16px var(--sans); text-align: center; background: var(--panel); cursor: pointer; padding: 0; }
  .metric .info:hover { color: var(--accent); border-color: var(--accent); }
  .info-pop { position: fixed; z-index: 1300; max-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12.5px; display: none; }
  .rel { display: inline-block; margin-top: 3px; color: #126b60; font-size: 11.5px; }
  .rel::before { content: '↻ '; }
  .side-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .side-foot a { color: inherit; }
  .side-support { display: flex; align-items: center; gap: 10px; margin: 0 14px 10px; padding: 9px 12px; border-radius: 12px; background: #fbe9e3; border: 1px solid #f6b89b; color: #7a2a17; text-decoration: none; }
  .side-support:hover { background: #f8dccf; }
  .side-support svg { width: 20px; height: 20px; flex: none; color: #e76f51; }
  .side-support b { display: block; font-size: 13px; }
  .side-support small { display: block; font-size: 12px; color: #9c2f1c; }

  /* map + controls */
  .stage { position: relative; min-width: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font: inherit; background: var(--bg); }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.85) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }
  .topbar { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .place-search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .place-search input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
  .place-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .place-search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: none; max-height: 320px; overflow-y: auto; }
  .results.show { display: block; }
  .results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 9px 14px; border: 0; background: none; cursor: pointer; text-align: left; }
  .results button:hover, .results button.sel { background: var(--accent-soft); }
  .results small { color: var(--muted); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .pill-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 14px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow); display: inline-flex; gap: 7px; align-items: center; }
  .pill-btn:hover { border-color: #8ccdc0; color: var(--accent); }
  .menu-btn { display: none; }

  .legend { position: absolute; right: 14px; bottom: 22px; z-index: 500; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 9px; box-shadow: var(--shadow); width: 300px; max-width: calc(100% - 28px); }
  .legend h3 { margin: 0 0 2px; font: 600 15px var(--display); }
  .legend .sub { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
  .legend .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
  .legend .bar i { flex: 1; }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .legend .na { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .legend .na i { width: 12px; height: 12px; border-radius: 3px; background: var(--na); display: inline-block; }

  /* detail panel */
  .detail { position: absolute; top: 72px; right: 14px; bottom: 150px; width: 380px; max-width: calc(100% - 28px); z-index: 1100; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden; }
  .detail.show { display: flex; }
  .d-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head h2 { margin: 0; font: 600 22px/1.15 var(--display); padding-right: 30px; }
  .d-head .hy { font: 600 15px var(--hy); color: var(--muted); margin-top: 2px; }
  .d-head .kind { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .d-x { position: absolute; top: 10px; right: 10px; border: 0; background: var(--panel-2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .d-body { overflow-y: auto; padding: 12px 16px 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 17px; font-weight: 700; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .stat.wide { grid-column: span 2; }
  .up { color: #0f766e; } .down { color: #b42318; }
  .d-body h3 { font: 600 14px var(--sans); margin: 14px 0 6px; }
  .chart { width: 100%; height: 150px; display: block; }
  .chart-tip { font-size: 12px; color: var(--muted); min-height: 18px; }
  table.zones { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.zones td, table.zones th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  table.zones td:first-child, table.zones th:first-child { text-align: left; }
  table.zones th { color: var(--muted); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); }
  .zchip { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11.5px; margin-right: 4px; }
  table.zone-pick tr[data-zone] { cursor: pointer; }
  table.zone-pick tr[data-zone]:hover td { background: var(--panel-2); }
  table.zone-pick tr.on td { background: var(--accent-soft); font-weight: 600; }
  table.zones small a { color: var(--muted); }
  .d-src { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; padding-top: 8px; }

  .town-label { background: none; border: 0; box-shadow: none; font: 600 11px var(--sans); color: #1f2937; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; padding: 0; }
  .town-label::before { display: none; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 900; background: var(--bg); color: var(--muted); font-weight: 600; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); z-index: 1200; }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .topbar { top: 10px; left: 10px; right: 10px; gap: 8px; }
    .place-search { flex-basis: 100%; max-width: none; order: 3; }
    .legend { left: 10px; right: 10px; bottom: 14px; width: auto; max-width: none; }
    .detail { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; height: 62dvh; border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#126b60"/><path d="M14 20l11-5 14 5 11-5v29l-11 5-14-5-11 5z" fill="none" stroke="#e6f4f1" stroke-width="3.5" stroke-linejoin="round"/><path d="M25 15v29M39 20v29" stroke="#8ccdc0" stroke-width="3.5"/></svg>
      <div><h1>Open Housing Atlas</h1><small class="byline">Free Armenia housing data</small><small id="asof">Loading data…</small></div>
    </a>
    <div class="country"><a href="/">United States</a><span>Armenia</span></div>
    <label class="dp-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="dpSearch" type="search" placeholder="Find a data point" aria-label="Find a data point"></label>
    <div class="groups" id="groups"></div>
    <a class="side-support" href="https://ko-fi.com/chrisbogh" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.9 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.8 0 5.9 3.9 4.3 7.4C19.5 16.4 12 21 12 21z"/></svg><span><b>Support on Ko-fi</b><small>Keep this atlas free for everyone</small></span></a>
    <div class="side-foot">
      Data: <a href="https://cadastre.am/en/market_analysis" target="_blank" rel="noopener">Cadastre Committee of Armenia</a>,
      <a href="https://statbank.armstat.am/" target="_blank" rel="noopener">Armstat</a>,
      <a href="https://www.cba.am/" target="_blank" rel="noopener">Central Bank of Armenia</a>.
      Map shapes © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors.
      <span id="built"></span> Not financial advice.
      <br><a href="mailto:contact@openhousingatlas.com?subject=Open%20Housing%20Atlas%20Armenia%20feedback">Feedback</a>
    </div>
  </aside>

  <main class="stage">
    <div id="map"></div>
    <div class="topbar">
      <button class="pill-btn menu-btn" id="menuBtn" aria-label="Data points">☰ Data</button>
      <div class="place-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search a district, town or marz (English or Հայերեն)" autocomplete="off" aria-label="Search places">
        <div class="results" id="results"></div>
      </div>
      <div class="seg" id="cur" role="group" aria-label="Currency"><button data-c="AMD" class="on">֏ AMD</button><button data-c="USD">$ USD</button></div>
      <button class="pill-btn" id="overviewBtn">Armenia overview</button>
    </div>
    <div class="legend" id="legend"></div>
    <section class="detail" id="detail" aria-live="polite">
      <div class="d-head"><button class="d-x" id="dClose" aria-label="Close">✕</button><h2 id="dTitle"></h2><div class="hy" id="dHy"></div><div class="kind" id="dKind"></div></div>
      <div class="d-body" id="dBody"></div>
    </section>
    <div class="loading" id="loading">Loading Armenia data…</div>
    <div class="info-pop" id="infoPop"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
// ---------- data points ----------
// rel: how often the source updates ('month' = Cadastre monthly report, 'year' = Armstat yearly, 'census' = once)
const METRICS = [
  { id: 'price', group: 'Prices and affordability', label: 'Apartment price per m²', level: 'district · town', money: true, rel: 'month',
    info: 'Average market price per square meter of apartments in apartment buildings, from the Cadastre Committee\'s monthly market report. Shown for Yerevan\'s 12 districts and 45 regional towns.' },
  { id: 'typical', group: 'Prices and affordability', label: 'Typical apartment price (60 m²)', level: 'district · town', money: true, rel: 'month',
    info: 'What a 60 m² apartment costs at the average price per m², a size typical of Soviet-era two-room flats. Armenia publishes no average house price, so this is the closest full-price figure.' },
  { id: 'chg12', group: 'Prices and affordability', label: 'Price change (1 year)', level: 'district · town', pct: true, rel: 'month',
    info: 'Change in the apartment price per m² compared with the same month a year earlier.' },
  { id: 'chg1', group: 'Prices and affordability', label: 'Price change (1 month)', level: 'district · town', pct: true, rel: 'month',
    info: 'Change in the apartment price per m² compared with the month before.' },
  { id: 'ptoi', group: 'Prices and affordability', label: 'Years of wages for a 60 m² apartment', level: 'district · town', unit: 'yrs', rel: 'month',
    info: 'Price of a 60 m² apartment divided by a year of the average gross wage in its marz (Armstat). Higher means less affordable.' },
  { id: 'deals', group: 'Market activity', label: 'Property transactions (month)', level: 'district · marz', rel: 'month',
    info: 'All real estate transactions registered with the Cadastre in the month: sales, gifts, mortgages, leases and more.' },
  { id: 'sales', group: 'Market activity', label: 'Property sales (month)', level: 'district · marz', rel: 'month',
    info: 'Sales of all kinds of property registered with the Cadastre in the month.' },
  { id: 'house_sales', group: 'Market activity', label: 'House sales (year)', level: 'marz', yearly: true, rel: 'year',
    info: 'Number of private houses sold in the year, by marz (Armstat, from Cadastre registrations). Armenia publishes no house prices, only how many sell.' },
  { id: 'apt_sales', group: 'Market activity', label: 'Apartment sales (year)', level: 'marz', yearly: true, rel: 'year',
    info: 'Number of apartments in apartment buildings sold in the year, by marz (Armstat, from Cadastre registrations).' },
  { id: 'wage', group: 'People and income', label: 'Average monthly wage', level: 'marz', money: true, yearly: true, rel: 'year',
    info: 'Average gross monthly wage of employees, by marz (Armstat).' },
  { id: 'poverty', group: 'People and income', label: 'Poverty rate', level: 'marz', unit: '%', yearly: true, rel: 'year',
    info: 'Share of people living below the national poverty line, by marz (Armstat household survey).' },
  { id: 'population', group: 'People and income', label: 'Population (2022 census)', level: 'marz', yearly: true, rel: 'census',
    info: 'Permanent population counted in the 2022 census (Armstat).' },
  { id: 'space', group: 'Housing', label: 'Housing space per person', level: 'marz', unit: 'm²', yearly: true, rel: 'year',
    info: 'Total floor area of the housing stock divided by the population, by marz (Armstat).' },
  { id: 'built', group: 'Housing', label: 'New housing built (m² per 1,000 people)', level: 'marz', yearly: true, rel: 'year',
    info: 'Floor area of new homes put into use in the latest year, per 1,000 residents (Armstat).' },
];
const GROUP_ICONS = { 'Prices and affordability': 'home', 'Market activity': 'activity', 'People and income': 'people', 'Housing': 'building' };
const ICONS = {
  home: 'M3 11 12 4l9 7M5 10v10h14V10M10 20v-5h4v5',
  activity: 'M3 12h4l3 7 4-14 3 7h4',
  people: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6',
  building: 'M4 21V8l8-5 8 5v13M9 21v-6h6v6M3 21h18',
};
const icon = name => `<svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
const M = Object.fromEntries(METRICS.map(m => [m.id, m]));
// The same colors as the US map: amounts light to dark teal; changes teal (falling), cream (flat), coral (rising)
const PALETTE = ['#e6f4f1', '#bfe3dc', '#8ccdc0', '#56b0a0', '#2b8f80', '#126b60', '#06463f'];
const DIVERGE = ['#0b5d5a', '#2a9d8f', '#8fd3c7', '#f4efe6', '#f6b89b', '#e76f51', '#9c2f1c'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const ui = { metric: 'price', cur: 'AMD', sel: null, open: new Set(['Prices and affordability']) };
let D = null, AREAS = null, map, marzLayer, distLayer, townLayer, labelLayer;

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const monthLabel = ym => ym ? `${MON[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}` : '';

// ---------- values per place ----------

const recent = ym => !!ym && ym >= addMonths(D.latest_month, -2);

  const marzId = kind === 'district' ? 'yerevan' : kind === 'town' ? p.marz : id;
  switch (metric) {
    case 'price': { const k = lastKey(p.price); return recent(k) ? toCur(p.price[k], k) : null; }
    case 'typical': { const k = lastKey(p.price); return recent(k) ? toCur(p.price[k] * 60, k) : null; }

// ---------- colors ----------
let scale = null;
function makeScale(values, metric) {

  if (!v.length) return { color: () => 'var(--na)', ticks: [], pal: PALETTE };
  const m = M[metric];
  if (m.pct) {
    const lim = Math.max(Math.abs(v[0]), Math.abs(v[v.length - 1]), 1);
    const steps = [-lim, -lim * .5, -lim * .15, lim * .15, lim * .5, lim * .8];
    const color = x => { let i = 0; while (i < steps.length && x > steps[i]) i++; return DIVERGE[Math.min(i, 6)]; };
    return { color, pal: DIVERGE, ticks: [fmtPct(-lim, 0), '0%', fmtPct(lim, 0)] };
  }
  const q = p => v[Math.min(v.length - 1, Math.floor(p * (v.length - 1)))];

}
const isMarzMetric = metric => M[metric].level === 'marz';

// ---------- map ----------
function initMap() {

  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Basemap &copy; Esri, HERE, Garmin, USGS, &copy; OpenStreetMap contributors', maxNativeZoom: 18 }).addTo(map);
  map.createPane('marz'); map.getPane('marz').style.zIndex = 410;
  map.createPane('dist'); map.getPane('dist').style.zIndex = 420;
  map.createPane('towns'); map.getPane('towns').style.zIndex = 440;
  const marzOsm = Object.fromEntries(Object.entries(D.marzes).map(([id, m]) => [id, m]));
  const marzById = {}; for (const [id] of Object.entries(marzOsm)) marzById[id] = id;
  const osmToMarz = { 364087: 'yerevan', 3917110: 'aragatsotn', 364083: 'ararat', 364086: 'armavir', 364080: 'gegharkunik', 364078: 'lori', 364084: 'kotayk', 364077: 'shirak', 364082: 'syunik', 364081: 'vayots-dzor', 364079: 'tavush' };
  const osmToDist = { 13404299: 'ajapnyak', 13404250: 'avan', 13404297: 'arabkir', 13404298: 'davtashen', 13404216: 'erebuni', 13404218: 'kentron', 13404219: 'malatia-sebastia', 13404220: 'nor-nork', 13404217: 'nork-marash', 13404214: 'nubarashen', 13404215: 'shengavit', 13404296: 'kanaker-zeytun' };
  const marzFeats = AREAS.features.filter(f => f.properties.kind === 'marz').map(f => (f.properties.id = osmToMarz[f.properties.osm_id], f));
  const distFeats = AREAS.features.filter(f => f.properties.kind === 'district').map(f => (f.properties.id = osmToDist[f.properties.osm_id], f));
  marzLayer = L.geoJSON({ type: 'FeatureCollection', features: marzFeats }, { pane: 'marz', style: () => ({}), onEachFeature: (f, l) => bindArea(l, 'marz', f.properties.id) }).addTo(map);
  distLayer = L.geoJSON({ type: 'FeatureCollection', features: distFeats }, { pane: 'dist', style: () => ({}), onEachFeature: (f, l) => bindArea(l, 'district', f.properties.id) }).addTo(map);
  townLayer = L.layerGroup().addTo(map);
  labelLayer = L.layerGroup().addTo(map);
  for (const [id, t] of Object.entries(D.towns)) {
    const c = L.circleMarker([t.lat, t.lon], { pane: 'towns', radius: 7, weight: 1.5, color: '#fff', fillOpacity: 1 });
    c.on('click', () => select('town', id));
    c.bindTooltip(() => tipHtml('town', id), { direction: 'top', offset: [0, -6] });
    c._place = id;
    townLayer.addLayer(c);
  }

}
function bindArea(layer, kind, id) {
  layer.on('click', e => { L.DomEvent.stopPropagation(e); select(kind, id); });
  layer.on('mouseover', () => layer.setStyle({ weight: kind === 'district' ? 2.5 : 2.5, color: '#0b4a43' }));
  layer.on('mouseout', () => restyle());
  layer.bindTooltip(() => tipHtml(kind, id), { sticky: true });
}
function placeName(kind, id) {
  const p = kind === 'district' ? D.districts[id] : kind === 'town' ? D.towns[id] : D.marzes[id];
  return p ? p.en : id;
}
function tipHtml(kind, id) {
  const v = valueOf(kind, id);
  const p = kind === 'district' ? D.districts[id] : kind === 'town' ? D.towns[id] : D.marzes[id];
  const kindLabel = kind === 'district' ? 'Yerevan district' : kind === 'town' ? `Town · ${D.marzes[p.marz]?.en || ''}` : id === 'yerevan' ? 'Capital city' : 'Marz (region)';
  return `<b>${esc(p.en)}</b> <span style="font-family:var(--hy);color:#6b7280">${esc(p.hy)}</span><br><small>${kindLabel}</small><br>${esc(M[ui.metric].label)}: <b>${fmtValue(v)}</b>`;

function restyle() {

  const vals = [];

// ---------- sidebar ----------

// ---------- search ----------
function allPlaces() {
  const out = [];
  for (const [id, p] of Object.entries(D.districts)) out.push({ kind: 'district', id, en: p.en, hy: p.hy, sub: 'Yerevan district' });
  for (const [id, p] of Object.entries(D.towns)) out.push({ kind: 'town', id, en: p.en, hy: p.hy, sub: `Town · ${D.marzes[p.marz].en}` });
  for (const [id, p] of Object.entries(D.marzes)) out.push({ kind: 'marz', id, en: p.en, hy: p.hy, sub: id === 'yerevan' ? 'Capital city' : 'Marz' });

}

  searchSel = 0;
  box.innerHTML = hits.length ? hits.map((p, i) => `<button data-k="${p.kind}" data-id="${p.id}" class="${i === 0 ? 'sel' : ''}"><span>${esc(p.en)} <span style="font-family:var(--hy);color:#6b7280">${esc(p.hy)}</span></span><small>${esc(p.sub)}</small></button>`).join('') : '<button disabled><small>No match</small></button>';

});
$('#results').addEventListener('click', e => {

document.addEventListener('click', e => { if (!e.target.closest('.place-search')) $('#results').classList.remove('show'); });

// ---------- detail panel ----------

  restyle(); renderDetail(); saveState();
  if (fly) {
    // keep the place in the part of the map the details panel doesn't cover (right side on desktop, bottom on phones)
    const phone = innerWidth <= 760, panel = $('#detail');
    const pad = phone ? { paddingTopLeft: [20, 150], paddingBottomRight: [20, panel.offsetHeight + 20] } : { paddingTopLeft: [40, 80], paddingBottomRight: [panel.offsetWidth + 40, 40] };
    let bounds = null;
    if (kind === 'town') bounds = L.latLng(D.towns[id].lat, D.towns[id].lon).toBounds(6000);
    else (kind === 'district' ? distLayer : marzLayer).eachLayer(l => { if (l.feature.properties.id === id) bounds = l.getBounds(); });
    if (bounds) map.flyToBounds(bounds, { ...pad, duration: .6, maxZoom: kind === 'town' ? 11 : 12 });
  }
}

const chgCls = v => v == null ? '' : v >= 0 ? 'up' : 'down';

  $('#dHy').textContent = p.hy;
  $('#dKind').textContent = kind === 'district' ? 'Administrative district of Yerevan' : kind === 'town' ? `Town in ${D.marzes[p.marz].en} marz` : id === 'yerevan' ? 'Capital city (counted as its own region)' : 'Marz (region) of Armenia';
  let h = '';

    const last = lastKey(p.price);
    const cur = last ? toCur(p.price[last], last) : null;
    h += `<div class="stats">${stat(`Apartment price per m² · ${monthLabel(last)}`, fmtMoney(cur, ui.cur), '', true)}
      ${stat('12-month change', fmtPct(change(p.price, 12)), chgCls(change(p.price, 12)))}
      ${stat('1-month change', fmtPct(change(p.price, 1)), chgCls(change(p.price, 1)))}
      ${stat('60 m² apartment', fmtMoney(cur == null ? null : cur * 60, ui.cur))}
      ${stat(`Years of ${D.marzes[marzId].en} wages`, valueOf(kind, id, 'ptoi') == null ? '–' : valueOf(kind, id, 'ptoi').toFixed(1))}</div>`;
    if (ui.cur === 'USD') h += `<p class="note">USD uses the Central Bank's average rate for each month (${usdRate(last)?.toFixed(2)} ֏ per $1 in ${monthLabel(last)}). Because the dram has moved against the dollar, the change in USD can differ from the change in drams.</p>`;
    h += `<h3>Price per m² (${ui.cur})</h3>${chart(seriesIn(p.price), v => fmtMoney(v, ui.cur))}`;
    if (last && last !== D.latest_month) h += `<p class="note">No price for ${monthLabel(D.latest_month)} in the latest report.</p>`;
    if (kind === 'district' && p.zones && Object.keys(p.zones.zones).length) {
      const zs = Object.entries(p.zones.zones);

      h += `<h3>Price zones in ${esc(p.en)} · ${monthLabel(p.zones.month)}</h3><table class="zones zone-pick"><tr><th>Zone</th><th>Per m² (${ui.cur})</th><th>12 months</th></tr>${zs.map(([z, v]) => {
        const c = v.ly ? (v.price / v.ly - 1) * 100 : null;
        return `<tr data-zone="${z}" class="${z === ui.zone ? 'on' : ''}"><td><span class="zchip">${z}</span> Zone ${z}</td><td>${fmtMoney(toCur(v.price, p.zones.month), ui.cur)}</td><td class="${chgCls(c)}">${fmtPct(c)}</td></tr>`;
      }).join('')}</table>
      <h3>Zone ${ui.zone}: price per m² (${ui.cur})</h3>${chart(seriesIn(p.zone_prices?.[ui.zone]), v => fmtMoney(v, ui.cur))}
      <p class="note">Yerevan is split into 11 valuation zones set by the government in 2020 (decision N 1023-N): zone 1 is the most central and expensive, zone 11 the outskirts. A district can contain several zones, and the same zone number means a similar location tier anywhere in the city. Click a zone to see its history. The zone boundaries are not published as open map data, so they can't be drawn on the map.</p>`;
    }
    if (kind === 'district') {
      h += `<h3>Transactions per month</h3><div class="stats">${stat(`All transactions · ${monthLabel(D.deals_month)}`, fmtInt(p.deals[D.deals_month]))}${stat('Sales', fmtInt(p.sales[D.deals_month]))}</div>${chart(p.sales, fmtInt, true)}<p class="note">Bars: property sales each month.</p>`;
      const ap = p.apartments; const ay = lastKey(ap);
      if (ay) h += `<div class="stats">${stat(`Apartments in apartment buildings · ${ay}`, fmtInt(ap[ay]), '', true)}</div>`;
    }
    if (kind === 'town') h += `<p class="note">Town prices come from fewer sales than Yerevan districts, so month-to-month moves can be noisy.</p>`;
    h += marzBlock(marzId, true);
  } else {
    h += marzBlock(id, false);
    if (id !== 'yerevan') {
      const towns = Object.entries(D.towns).filter(([, t]) => t.marz === id);
      h += `<h3>Towns · apartment price per m² (${ui.cur}) · ${monthLabel(D.latest_month)}</h3><table class="zones"><tr><th>Town</th><th>Per m²</th><th>12 months</th></tr>${towns.map(([tid, t]) => {
        const k = lastKey(t.price), c = change(t.price, 12);
        return `<tr><td><a href="#" data-town="${tid}">${esc(t.en)}</a></td><td>${fmtMoney(k ? toCur(t.price[k], k) : null, ui.cur)}</td><td class="${chgCls(c)}">${fmtPct(c)}</td></tr>`;
      }).join('')}</table>`;
    } else {
      h += zoneOverview();
      h += `<h3>Districts · apartment price per m² (${ui.cur}) · ${monthLabel(D.latest_month)}</h3><table class="zones"><tr><th>District</th><th>Per m²</th><th>12 months</th></tr>${Object.entries(D.districts).sort((a, b) => (lastVal(b[1].price) || 0) - (lastVal(a[1].price) || 0)).map(([did, d]) => {
        const k = lastKey(d.price), c = change(d.price, 12);
        return `<tr><td><a href="#" data-dist="${did}">${esc(d.en)}</a></td><td>${fmtMoney(k ? toCur(d.price[k], k) : null, ui.cur)}</td><td class="${chgCls(c)}">${fmtPct(c)}</td></tr>`;
      }).join('')}</table>`;
    }
  }
  h += sourceNote();
  $('#dBody').innerHTML = h;
  wireCharts();
}
const lastVal = o => { const k = lastKey(o); return k ? o[k] : null; };
// Yerevan's valuation zones across the whole city: the same zone number is a similar location tier in any district
function zoneOverview() {
  const byZone = {};
  let month = null;
  for (const [did, d] of Object.entries(D.districts)) {
    if (!d.zones) continue;
    month = month && month > d.zones.month ? month : d.zones.month;
    for (const [z, v] of Object.entries(d.zones.zones)) (byZone[z] ||= []).push({ did, en: d.en, price: toCur(v.price, d.zones.month) });
  }
  const zones = Object.keys(byZone).sort((a, b) => a - b);
  if (!zones.length) return '';
  return `<h3>Yerevan price zones · ${monthLabel(month)} (${ui.cur} per m²)</h3><table class="zones"><tr><th>Zone</th><th>Lowest</th><th>Highest</th></tr>${zones.map(z => {
    const list = byZone[z].sort((a, b) => a.price - b.price), lo = list[0], hi = list[list.length - 1];
    return `<tr><td><span class="zchip">${z}</span></td><td>${fmtMoney(lo.price, ui.cur)} <small><a href="#" data-dist="${lo.did}">${esc(lo.en)}</a></small></td><td>${list.length > 1 ? `${fmtMoney(hi.price, ui.cur)} <small><a href="#" data-dist="${hi.did}">${esc(hi.en)}</a></small>` : '–'}</td></tr>`;
  }).join('')}</table><p class="note">Zone 1 is the city center; higher numbers are further out. Each zone covers parts of one or more districts.</p>`;
}
function marzBlock(marzId, asContext) {
  const m = D.marzes[marzId];
  const wy = lastKey(m.wage), py = lastKey(m.poverty), sy = lastKey(m.space_per_person), by = lastKey(m.new_housing_m2);
  const wage = wy ? (ui.cur === 'USD' ? m.wage[wy] / usdRate(wy + '-12') : m.wage[wy]) : null;
  const built = valueOf('marz', marzId, 'built');
  let h = `<h3>${asContext ? `${esc(m.en)} ${marzId === 'yerevan' ? '(city)' : 'marz'} at a glance` : 'At a glance'}</h3><div class="stats">
    ${stat(`Average monthly wage · ${wy || ''}`, fmtMoney(wage, ui.cur))}
    ${stat(`Poverty rate · ${py || ''}`, m.poverty?.[py] != null ? m.poverty[py].toFixed(1) + '%' : '–')}
    ${stat('Population · 2022 census', fmtInt(m.population?.['2022']))}
    ${stat(`Housing space per person · ${sy || ''}`, m.space_per_person?.[sy] != null ? m.space_per_person[sy].toFixed(1) + ' m²' : '–')}
    ${stat(`New housing built · ${by || ''}`, m.new_housing_m2?.[by] != null ? fmtInt(m.new_housing_m2[by]) + ' m²' : '–')}
    ${stat('New housing per 1,000 people', built == null ? '–' : built.toFixed(0) + ' m²')}
    ${stat(`Transactions · ${monthLabel(D.deals_month)}`, fmtInt(m.deals?.[D.deals_month]))}
    ${stat('Property sales', fmtInt(m.sales?.[D.deals_month]))}
    ${stat(`Houses sold · ${lastKey(m.house_sales) || ''}`, fmtInt(latestYearVal(m.house_sales)))}
    ${stat(`Apartments sold · ${lastKey(m.apartment_sales) || ''}`, fmtInt(latestYearVal(m.apartment_sales)))}</div>`;
  if (!asContext) {
    h += `<h3>Property sales per month</h3>${chart(m.sales, fmtInt, true)}`;
    if (Object.keys(m.house_sales || {}).length > 2) h += `<h3>Houses sold per year</h3>${chart(yearly(m.house_sales), fmtInt, true)}<h3>Apartments sold per year</h3>${chart(yearly(m.apartment_sales), fmtInt, true)}<p class="note">Armenia publishes no house prices; these yearly counts (Armstat) show how active the market for private houses is.</p>`;
    if (Object.keys(m.wage || {}).length > 2) h += `<h3>Average monthly wage (${ui.cur})</h3>${chart(yearlyIn(m.wage), v => fmtMoney(v, ui.cur))}`;
    if (Object.keys(m.poverty || {}).length > 2) h += `<h3>Poverty rate</h3>${chart(yearly(m.poverty), v => v.toFixed(1) + '%')}`;
  }
  return h;
}
const yearly = o => Object.fromEntries(Object.entries(o || {}).map(([y, v]) => [y + '-12', v]));
const yearlyIn = o => Object.fromEntries(Object.entries(o || {}).map(([y, v]) => [y + '-12', ui.cur === 'USD' ? v / usdRate(y + '-12') : v]));
function renderNational() {
  const n = D.national;
  $('#dTitle').textContent = 'Armenia overview';
  $('#dHy').textContent = 'Հայաստան';
  $('#dKind').textContent = 'Nationwide figures';
  const mk = lastKey(n.mortgage), mort = mk ? n.mortgage[mk] : null;
  const rate = n.policy_rate?.length ? n.policy_rate[n.policy_rate.length - 1] : null;
  const ik = lastKey(n.inflation), uk = lastKey(n.usd);
  const mortTotal = Object.fromEntries(Object.entries(n.mortgage || {}).map(([k, v]) => [k, toCur(v.total * 1e6, k) / 1e9]));
  const unit = ui.cur === 'USD' ? '$ billion' : 'billion ֏';
  let h = `<div class="stats">
    ${stat(`Mortgage loans outstanding · ${monthLabel(mk)}`, mort ? (ui.cur === 'USD' ? '$' + (toCur(mort.total * 1e6, mk) / 1e9).toFixed(2) + ' bn' : (mort.total / 1000).toFixed(0) + ' bn ֏') : '–', '', true)}
    ${stat('Share in drams', mort && mort.amd ? (mort.amd / mort.total * 100).toFixed(0) + '%' : '–')}
    ${stat(`Policy rate · since ${rate ? rate[0].split('-').reverse().join('.') : ''}`, rate ? rate[1].toFixed(2) + '%' : '–')}
    ${stat(`Inflation (12 months) · ${monthLabel(ik)}`, n.inflation?.[ik] != null ? fmtPct(n.inflation[ik]) : '–')}
    ${stat(`Dram per US dollar · ${monthLabel(uk)} avg.`, n.usd?.[uk] ? n.usd[uk].toFixed(2) + ' ֏' : '–')}
    ${stat(`Transactions · ${monthLabel(D.deals_month)}`, fmtInt(n.deals?.[D.deals_month]))}
    ${stat('Property sales', fmtInt(n.sales?.[D.deals_month]))}
    ${stat(`Houses sold · ${lastKey(n.house_sales) || ''}`, fmtInt(latestYearVal(n.house_sales)))}
    ${stat(`Apartments sold · ${lastKey(n.apartment_sales) || ''}`, fmtInt(latestYearVal(n.apartment_sales)))}</div>
    <h3>Mortgage loans outstanding (${unit})</h3>${chart(mortTotal, v => v.toFixed(ui.cur === 'USD' ? 2 : 0) + (ui.cur === 'USD' ? ' bn $' : ' bn ֏'))}
    <p class="note">All commercial-bank mortgage loans, end of each month (Central Bank of Armenia). No mortgage interest rate is published separately.</p>
    <h3>Property sales per month (whole country)</h3>${chart(n.sales, fmtInt, true)}
    <h3>Dram per US dollar (monthly average)</h3>${chart(n.usd, v => v.toFixed(1) + ' ֏')}
    <h3>Inflation, 12 months</h3>${chart(Object.fromEntries(Object.entries(n.inflation || {}).filter(([k]) => k >= '2015')), v => fmtPct(v))}
    <h3>Earthquake risk</h3><p class="note">All of Armenia is rated <b>high</b> for earthquake hazard (<a href="https://thinkhazard.org/en/report/13-armenia" target="_blank" rel="noopener">ThinkHazard!</a>, <a href="https://www.globalquakemodel.org/product/global-seismic-hazard-map" target="_blank" rel="noopener">GEM hazard map</a>). Building age and construction matter a lot; ask for a building's seismic assessment before buying.</p>
    <h3>Rents</h3><p class="note">Armenia publishes no official rent figures by area, so this map does not show rents.</p>`;
  h += sourceNote();

function sourceNote() {
  const gaps = D.months_unreadable?.length ? ` Some monthly reports could not be read automatically (${D.months_unreadable.length} months), so a few points on the charts are filled from the next report's "previous month" or "last year" columns, or left as gaps.` : '';
  return `<div class="d-src">Prices: average market prices of apartments in apartment buildings, from the monthly reports of the
    <a href="https://cadastre.am/en/market_analysis" target="_blank" rel="noopener">State Committee of the Real Estate Cadastre</a>.
    Wages, poverty, population and housing: <a href="https://statbank.armstat.am/" target="_blank" rel="noopener">Armstat</a>.
    Exchange rates and mortgages: <a href="https://www.cba.am/" target="_blank" rel="noopener">Central Bank of Armenia</a>.${gaps}</div>`;

$('#dBody').addEventListener('click', e => {
  const zr = e.target.closest('[data-zone]');

  const t = e.target.closest('[data-town]'), d = e.target.closest('[data-dist]');

// ---------- small SVG charts ----------
let chartN = 0;
const CHARTS = {};
function chart(series, fmt, bars = false) {
  const pts = Object.entries(series || {}).filter(([, v]) => v != null && !isNaN(v)).sort();
  if (pts.length < 2) return '<p class="note">Not enough history yet.</p>';
  const id = 'ch' + (++chartN);
  const W = 340, H = 150, L0 = 4, R0 = 4, T0 = 10, B0 = 22;
  const toIdx = ym => +ym.slice(0, 4) * 12 + +ym.slice(5, 7) - 1;
  const x0 = toIdx(pts[0][0]), x1 = toIdx(pts[pts.length - 1][0]);
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (bars) lo = Math.min(0, lo);
  const pad = (hi - lo) * .08 || 1; if (!bars) lo -= pad; hi += pad;
  const X = ym => L0 + (toIdx(ym) - x0) / Math.max(1, x1 - x0) * (W - L0 - R0);
  const Y = v => T0 + (1 - (v - lo) / (hi - lo)) * (H - T0 - B0);
  let body = '';
  if (bars) {
    const bw = Math.max(1, (W - L0 - R0) / Math.max(1, x1 - x0 + 1) - 1);
    body = pts.map(([ym, v]) => `<rect x="${(X(ym) - bw / 2).toFixed(1)}" y="${Y(Math.max(v, 0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.abs(Y(v) - Y(0)).toFixed(1)}" fill="#4fae9f"/>`).join('');
  } else {
    // a gap is a jump bigger than the series' usual spacing (monthly data: > 3 months; yearly data: > 18 months)
    const steps = pts.slice(1).map(([ym], i) => toIdx(ym) - toIdx(pts[i][0])).sort((a, b) => a - b);
    const gap = Math.max(3, (steps[Math.floor(steps.length / 2)] || 1) * 1.5);
    let d = '', prev = null;
    for (const [ym, v] of pts) { d += (prev != null && toIdx(ym) - prev <= gap ? 'L' : 'M') + X(ym).toFixed(1) + ' ' + Y(v).toFixed(1); prev = toIdx(ym); }
    // points with no neighbor on either side (gaps in the reports) are drawn as dots so they still show
    const lone = pts.filter(([ym], i) => !(i > 0 && toIdx(ym) - toIdx(pts[i - 1][0]) <= gap) && !(i < pts.length - 1 && toIdx(pts[i + 1][0]) - toIdx(ym) <= gap));
    body = `<path d="${d}" fill="none" stroke="#126b60" stroke-width="2" stroke-linejoin="round"/>` +
      lone.map(([ym, v]) => `<circle cx="${X(ym).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="#126b60"/>`).join('');
  }
  const y0 = pts[0][0].slice(0, 4), y1 = pts[pts.length - 1][0].slice(0, 4);
  const axis = `<line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#e5e7eb"/>
    <text x="${L0}" y="${H - 6}" font-size="11" fill="#6b7280">${y0}</text><text x="${W - R0}" y="${H - 6}" font-size="11" fill="#6b7280" text-anchor="end">${y1}</text>
    <text x="${L0 + 2}" y="${T0 + 2}" font-size="11" fill="#6b7280">${esc(fmt(hi))}</text>`;
  CHARTS[id] = { pts, fmt, X, Y, W };
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Chart">${axis}${body}<line class="cur" x1="0" x2="0" y1="${T0}" y2="${H - B0}" stroke="#9ca3af" stroke-dasharray="2 2" visibility="hidden"/><circle class="dot" r="3.5" fill="#126b60" visibility="hidden"/></svg>
    <div class="chart-tip" id="${id}t">Latest: <b>${esc(monthLabel(pts[pts.length - 1][0]))}</b> · ${esc(fmt(pts[pts.length - 1][1]))}</div>`;
}
function wireCharts() {
  for (const [id, c] of Object.entries(CHARTS)) {
    const svg = document.getElementById(id); if (!svg) { delete CHARTS[id]; continue; }
    const tip = document.getElementById(id + 't');
    const show = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const sx = x / r.width * c.W;
      let best = c.pts[0], bd = Infinity;
      for (const p of c.pts) { const d = Math.abs(c.X(p[0]) - sx); if (d < bd) { bd = d; best = p; } }
      const cur = svg.querySelector('.cur'), dot = svg.querySelector('.dot');
      cur.setAttribute('x1', c.X(best[0])); cur.setAttribute('x2', c.X(best[0])); cur.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', c.X(best[0])); dot.setAttribute('cy', c.Y(best[1])); dot.setAttribute('visibility', 'visible');
      tip.innerHTML = `<b>${esc(monthLabel(best[0]))}</b> · ${esc(c.fmt(best[1]))}`;
    };
    svg.addEventListener('mousemove', show); svg.addEventListener('touchmove', show, { passive: true });
    delete CHARTS[id];
  }
}

// ---------- remembered view (this browser only) ----------
function saveState() {
  try { localStorage.setItem('oha-armenia', JSON.stringify({ metric: ui.metric, cur: ui.cur, open: [...ui.open] })); } catch (e) { }
  const q = new URLSearchParams();
  if (ui.metric !== 'price') q.set('m', ui.metric);
  if (ui.cur !== 'AMD') q.set('c', ui.cur);
  if (ui.sel) q.set('p', ui.sel.kind + ':' + ui.sel.id);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
}
function loadState() {
  try { const s = JSON.parse(localStorage.getItem('oha-armenia') || '{}'); if (M[s.metric]) ui.metric = s.metric; if (s.cur === 'USD') ui.cur = 'USD'; if (Array.isArray(s.open)) ui.open = new Set(s.open); } catch (e) { }
  ui.open.add(M[ui.metric].group);   // the group holding the chosen data point starts open
  const q = new URLSearchParams(location.search);
  if (M[q.get('m')]) ui.metric = q.get('m');
  if (q.get('c') === 'USD') ui.cur = 'USD';
  if (q.get('c') === 'AMD') ui.cur = 'AMD';
  const p = (q.get('p') || '').split(':');
  if (p.length === 2) {
    const ok = p[0] === 'national' || (p[0] === 'district' && D.districts[p[1]]) || (p[0] === 'town' && D.towns[p[1]]) || (p[0] === 'marz' && D.marzes[p[1]]);
    if (ok) ui.sel = { kind: p[0], id: p[1] };
  }
  document.querySelectorAll('#cur button').forEach(x => x.classList.toggle('on', x.dataset.c === ui.cur));
}

Promise.all([fetch('data/armenia.json').then(r => r.json()), fetch('data/areas.geojson').then(r => r.json())])
  .then(([data, areas]) => {
    D = data; AREAS = areas;
    // transaction tables can be a month behind the prices (some reports have them only as pictures)
    D.deals_month = lastKey(D.national.deals) || D.latest_month;
    loadState();
    $('#built').textContent = `Prices through ${monthLabel(D.latest_month)}; updated ${D.built}.`;
    $('#asof').textContent = `Updated ${D.built}`;
    renderMetrics();
    initMap();
    restyle();
    if (ui.sel) ui.sel.kind === 'national' ? renderDetail() : select(ui.sel.kind, ui.sel.id, true);
    $('#loading').remove();
  })
  .catch(err => { $('#loading').textContent = 'The Armenia data could not be loaded. Please try again later.'; console.error(err); });
