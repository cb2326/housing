<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f3f4f6; --line: #e5e7eb; --text: #111827; --muted: #6b7280;
    --accent: #126b60; --accent-soft: #e6f4f1; --warm: #f59e0b;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -10px rgba(16, 24, 40, .18);
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", "Noto Sans Armenian", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --hy: "Noto Sans Armenian", "Inter", system-ui, sans-serif;
    --na: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100dvh; }

  /* sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px; text-decoration: none; color: inherit; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 { margin: 0; font: 600 21px/1.1 var(--display); }
  .brand small { display: block; color: var(--muted); font: 12px var(--sans); margin-top: 2px; }
  .country { display: flex; gap: 6px; margin: 6px 14px 10px; }
  .country a, .country span { flex: 1; text-align: center; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); font-weight: 600; font-size: 12.5px; text-decoration: none; color: var(--muted); }
  .country span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .country a:hover { border-color: #8ccdc0; color: var(--accent); }
  .brand .byline { color: var(--accent); font-weight: 600; font-size: 12.5px; margin-top: 3px; }
  /* data points: the same collapsible groups as the US map */
  .dp-search { margin: 4px 14px 10px; position: relative; display: block; }
  .dp-search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .dp-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .groups { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
  .group { border-top: 1px solid var(--line); }
  .group > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 12px 8px; cursor: pointer; font-weight: 600; text-align: left; }
  .group > button::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
  .group.open > button::after { transform: rotate(-135deg); }
  .group > button span { display: inline-flex; align-items: center; gap: 8px; }
  .group ul { list-style: none; margin: 0 0 8px; padding: 0; display: none; }
  .group.open ul { display: block; }
  .gi { width: 17px; height: 17px; color: var(--accent); flex: none; }
  .group .dot { width: 7px; height: 7px; border-radius: 50%; background: #e76f51; display: inline-block; }
  .metric { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .metric:hover { background: var(--accent-soft); }
  .metric input { accent-color: var(--accent); margin: 0; flex: none; }
  .metric span { flex: 1; }
  .metric.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .metric .info { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font: 600 11px/16px var(--sans); text-align: center; background: var(--panel); cursor: pointer; padding: 0; }
  .metric .info:hover { color: var(--accent); border-color: var(--accent); }
  .info-pop { position: fixed; z-index: 1300; max-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12.5px; display: none; }
  .rel { display: inline-block; margin-top: 3px; color: #126b60; font-size: 11.5px; }
  .rel::before { content: '↻ '; }
  .side-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .side-foot a { color: inherit; }
  .side-support { display: flex; align-items: center; gap: 10px; margin: 0 14px 10px; padding: 9px 12px; border-radius: 12px; background: #fbe9e3; border: 1px solid #f6b89b; color: #7a2a17; text-decoration: none; }
  .side-support:hover { background: #f8dccf; }
  .side-support svg { width: 20px; height: 20px; flex: none; color: #e76f51; }
  .side-support b { display: block; font-size: 13px; }
  .side-support small { display: block; font-size: 12px; color: #9c2f1c; }

  /* map + controls */
  .stage { position: relative; min-width: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font: inherit; background: var(--bg); }
  .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.85) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }
  .topbar { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .place-search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .place-search input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
  .place-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .place-search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: none; max-height: 320px; overflow-y: auto; }
  .results.show { display: block; }
  .results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 9px 14px; border: 0; background: none; cursor: pointer; text-align: left; }
  .results button:hover, .results button.sel { background: var(--accent-soft); }
  .results small { color: var(--muted); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .pill-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 14px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow); display: inline-flex; gap: 7px; align-items: center; }
  .pill-btn:hover { border-color: #8ccdc0; color: var(--accent); }
  .menu-btn { display: none; }

  .legend { position: absolute; right: 14px; bottom: 22px; z-index: 500; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 9px; box-shadow: var(--shadow); width: 300px; max-width: calc(100% - 28px); }
  .legend h3 { margin: 0 0 2px; font: 600 15px var(--display); }
  /* Support (Ko-fi) and Feedback buttons sitting just above the legend, as on the US map */
  .lg-support { position: absolute; right: 0; bottom: calc(100% + 8px); display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 8px; border-radius: 999px; background: #fbe9e3; border: 1px solid #f6b89b; color: #9c2f1c; font-size: 12px; font-weight: 600; text-decoration: none; box-shadow: var(--shadow); }
  .lg-support:hover { background: #f8dccf; }
  .lg-support.lg-feedback { bottom: calc(100% + 46px); background: #fff; border-color: #8ccdc0; color: #126b60; }
  .lg-support.lg-feedback:hover { background: #e6f4f1; }
  .lg-support svg { width: 13px; height: 13px; }
  .legend .sub { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
  .legend .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
  .legend .bar i { flex: 1; }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .us-val { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; padding: 8px 10px; background: var(--panel-2); border-radius: 10px; }
  .us-val span { font-size: 13px; color: var(--muted); }
  .us-val b { font-size: 20px; font-family: var(--display); color: #06463f; }
  .legend .na { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .legend .na i { width: 12px; height: 12px; border-radius: 3px; background: var(--na); display: inline-block; }
  /* zone map: price bands you can read at a glance; hovering or tapping a band shows only those zones */
  .legend .zbands { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-top: 2px; }
  .legend .zb { display: flex; align-items: center; gap: 7px; font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 4px; border-radius: 6px; cursor: pointer; border: 0; background: none; color: inherit; text-align: left; font-family: inherit; }
  .legend .zb:hover, .legend .zb.on { background: var(--panel-2); }
  .legend .zb i { width: 16px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .legend .zhint { font-size: 11px; color: var(--muted); margin-top: 5px; }
  /* calmer, grey basemap under the zone colors */
  #map.zone-mode .leaflet-tile-pane { filter: grayscale(1) contrast(.9) brightness(1.06); opacity: .7; }
  .plabel.zl .in { font-size: 12px; }
  .plabel.zl .in b { font-size: 10px; font-weight: 600; color: #374151; }
  .plabel.dl .in { font: 700 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: #1f2937; }

  /* detail panel: like the US map, it opens on the left next to the data points and the map moves to its right */
  .stage { --pw: min(680px, 58%); }
  .detail { position: absolute; top: 0; left: 0; bottom: 0; width: var(--pw); max-width: 100%; z-index: 1100; background: var(--panel); border-right: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; transform: translateX(-102%); transition: transform .22s ease; visibility: hidden; }
  .detail.show { transform: none; visibility: visible; }
  @media (min-width: 761px) {
    .stage.panel-open .topbar { left: calc(var(--pw) + 14px); }
    .stage.panel-open .leaflet-left { left: var(--pw); }
    .stage .topbar, .stage .leaflet-left { transition: left .22s ease; }
  }
  .d-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head h2 { margin: 0; font: 700 26px/1.15 var(--display); padding-right: 40px; color: var(--accent); letter-spacing: -0.01em; }
  .metric-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 0 8px; }
  .dp-switch { position: relative; display: inline-flex; align-items: center; gap: 10px; font: 600 17px var(--sans); cursor: pointer; padding: 6px 10px 6px 0; }
  .dp-switch .sw { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .dp-switch select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .mnow { text-align: right; flex: none; }
  .mnow b { display: block; font: 700 24px/1.1 var(--display); color: #06463f; }
  .mnow span { font-size: 12px; color: var(--muted); }
  .chart-ctrl { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0 6px; }
  .seg-sm { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; }
  .seg-sm button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .seg-sm button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chart.big { height: 250px; }
  .chart-empty { padding: 24px; text-align: center; background: var(--panel-2); border-radius: 12px; color: var(--muted); }
  .chart-empty b { display: block; font-size: 22px; color: var(--text); margin-bottom: 4px; }
  .snap-h { margin: 18px 0 8px; font: 600 14.5px var(--sans); }
  .snap-h small { color: var(--muted); font-weight: 500; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .kpi { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .kpi:hover { border-color: #8ccdc0; }
  .kpi.on { border-color: var(--accent); background: var(--accent-soft); }
  .kpi span { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .kpi span small { font-size: 11px; }
  .kpi b { font-size: 18px; font-weight: 700; }
  .kpi > small { font-size: 11px; color: var(--muted); }
  .d-head .hy { font: 600 15px var(--hy); color: var(--muted); margin-top: 2px; }
  .d-head .kind { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .d-x { position: absolute; top: 10px; right: 10px; border: 0; background: var(--panel-2); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .d-body { overflow-y: auto; padding: 14px 18px 24px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 17px; font-weight: 700; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .stat.wide { grid-column: span 2; }
  .up { color: #0f766e; } .down { color: #b42318; }
  .d-body h3 { font: 600 14px var(--sans); margin: 14px 0 6px; }
  .chart { width: 100%; height: 150px; display: block; }
  .chart-tip { font-size: 12px; color: var(--muted); min-height: 18px; }
  table.zones { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.zones td, table.zones th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  table.zones td:first-child, table.zones th:first-child { text-align: left; }
  table.zones th { color: var(--muted); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); }
  .zchip { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11.5px; margin-right: 4px; }
  table.zone-pick tr[data-zone] { cursor: pointer; }
  table.zone-pick tr[data-zone]:hover td { background: var(--panel-2); }
  table.zone-pick tr.on td { background: var(--accent-soft); font-weight: 600; }
  table.zones small a { color: var(--muted); }
  .d-src { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; padding-top: 8px; }

  /* value labels on the map: the same style as the US map */
  .plabel { width: 0 !important; height: 0 !important; }
  .plabel .in { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; font: 600 11px/1.2 var(--sans); color: #111827; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff, 0 0 1px #fff; pointer-events: none; }
  .plabel .in b { display: block; font-weight: 600; }
  .plabel .in span { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }
  .plabel.tlabel .in { transform: translate(9px, -50%); text-align: left; }
  @media (max-width: 760px) { .plabel .in { font-size: 10px; } }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 900; background: var(--bg); color: var(--muted); font-weight: 600; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); z-index: 1200; }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .topbar { top: 10px; left: 10px; right: 10px; gap: 8px; }
    .place-search { flex-basis: 100%; max-width: none; order: 3; }
    .seg { padding: 3px; }
    .seg button { padding: 6px 9px; font-size: 13px; }
    #overviewBtn { padding: 7px 11px; font-size: 13px; }
    .legend { left: 10px; right: 10px; bottom: 14px; width: auto; max-width: none; }
    .detail { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-width: none; height: 70dvh; border-radius: 16px 16px 0 0; border-right: 0; transform: translateY(102%); }
    .detail.show { transform: none; }
    /* phone-sized details sheet: handle bar, compact header, value under the name, two columns of tiles */
    .detail { height: 82dvh; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
    .detail::before { content: ''; position: absolute; top: 7px; left: 50%; width: 42px; height: 4px; border-radius: 2px; background: #d1d5db; transform: translateX(-50%); z-index: 2; }
    .d-head { padding: 18px 56px 10px 16px; }
    .d-head h2 { font-size: 20px; padding-right: 0; }
    .d-head .hy { font-size: 13.5px; }
    .d-head .kind { font-size: 11.5px; }
    .d-x { top: 14px; right: 12px; width: 36px; height: 36px; font-size: 15px; }
    .d-body { padding: 10px 14px calc(28px + env(safe-area-inset-bottom)); }
    .metric-head { flex-direction: column; align-items: stretch; gap: 2px; margin-bottom: 4px; }
    .dp-switch { font-size: 15px; padding: 4px 0; justify-content: space-between; }
    .mnow { text-align: left; display: flex; align-items: baseline; gap: 8px; }
    .mnow b { font-size: 22px; }
    .chart-ctrl .note { display: none; }
    .chart.big { height: 180px; }
    .chart-tip { font-size: 11.5px; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 6px; }
    .kpi { padding: 8px 10px; }
    .kpi b { font-size: 16px; }
    .kpi span { font-size: 11.5px; }
    .snap-h { margin: 14px 0 6px; font-size: 14px; }
    table.zones { font-size: 12px; }
    .stage.sheet-open .legend { display: none; }
    .leaflet-bottom.leaflet-left { bottom: 150px; }   /* zoom buttons above the legend */
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="/">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#126b60"/><path d="M14 20l11-5 14 5 11-5v29l-11 5-14-5-11 5z" fill="none" stroke="#e6f4f1" stroke-width="3.5" stroke-linejoin="round"/><path d="M25 15v29M39 20v29" stroke="#8ccdc0" stroke-width="3.5"/></svg>
      <div><h1>Open Housing Atlas</h1><small class="byline">Free Armenia housing data</small><small id="asof">Loading data…</small></div>

// ---------- helpers ----------
const $ = s => document.querySelector(s);

function restyle() {

    if (townMode) return { fillColor: '#ffffff', fillOpacity: .3, color: sel ? '#0b4a43' : '#9ca3af', weight: sel ? 3 : 1, opacity: 1 };   // Yerevan in grey: towns are the colored ones
    const v = valueOf('district', id);

// One zone piece: filled with its price band; pieces outside the band picked in the legend fade out
function zoneStyle(f) {

// Name and value written on the map, like the US map: the biggest areas first, and a label is skipped when it

function labelValue(v, metric = ui.metric) {

  if (m.money) {
    if (ui.cur === 'USD') return v >= 10000 ? '$' + Math.round(v / 1000) + 'k' : '$' + Math.round(v).toLocaleString('en-US');
    return v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M ֏' : v >= 1e3 ? Math.round(v / 1e3) + 'k ֏' : Math.round(v) + ' ֏';

function updateLabels() {
  if (!labelLayer) return;

  const lv = curLevel(), marzMode = lv === 'marz', townMode = lv === 'town';
  const size = map.getSize(), view = map.getBounds(), cand = [], placed = [];
  const fits = box => box[0] > 4 && box[1] > 56 && box[2] < size.x - 4 && box[3] < size.y - 4 && !placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1]);
  const areaCand = (layer, kind) => layer.eachLayer(l => {
    const id = l.feature.properties.id;
    const b = l._bb || (l._bb = l.getBounds());
    if (!b.isValid() || !view.intersects(b)) return;
    const ne = map.latLngToContainerPoint(b.getNorthEast()), sw = map.latLngToContainerPoint(b.getSouthWest());
    const w = ne.x - sw.x, h = sw.y - ne.y;
    if (w < 34 || h < 22) return;
    const a = l.getCenter(), pt = map.latLngToContainerPoint(a);
    cand.push({ kind, id, w, h, a, pt });

    // only the bigger pieces get a price so the map stays readable
    const z = map.getZoom(), minW = z >= 14 ? 40 : z >= 13 ? 50 : 76, minH = z >= 14 ? 24 : z >= 13 ? 28 : 40;
    if (z >= 11) distLayer.eachLayer(l => {
      const b = l._bb || (l._bb = l.getBounds());
      if (!view.intersects(b)) return;
      const name = placeName('district', l.feature.properties.id).split(' (')[0];
      const pt = map.latLngToContainerPoint(b.getCenter()), tw = name.length * 8 + 8;
      const box = [pt.x - tw / 2, pt.y - 8, pt.x + tw / 2, pt.y + 8];
      if (!fits(box)) return;
      placed.push(box);
      L.marker(b.getCenter(), { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: 'plabel dl', iconSize: [0, 0], html: `<div class="in">${esc(name)}</div>` }) }).addTo(labelLayer);
    });
    zoneLayer.eachLayer(l => {
      const b = l._bb || (l._bb = l.getBounds());
      if (!b.isValid() || !view.intersects(b)) return;
      const ne = map.latLngToContainerPoint(b.getNorthEast()), sw = map.latLngToContainerPoint(b.getSouthWest());
      const w = ne.x - sw.x, h = sw.y - ne.y;
      if (w < minW || h < minH) return;

      const a = l.getCenter();

    });

  cand.sort((x, y) => y.w * y.h - x.w * x.h);

    const zv = c.kind === 'zone' ? zoneValue(c.props) : null;
    if (c.kind === 'zone' && zv == null) continue;
    const name = c.kind === 'zone' ? `Zone ${c.props.zone}` : placeName(c.kind, c.id).split(' (')[0];
    const val = labelValue(c.kind === 'zone' ? zv : valueOf(c.kind, c.id));
    const tw = Math.max(name.length * 6.4, val.length * 6.8) + 6, th = 28;
    if (tw > c.w * 1.15 || th > c.h * 1.2) continue;

    if (!fits(box)) continue;
    placed.push(box);
    L.marker(c.a, { pane: 'labels', interactive: false, keyboard: false, icon: L.divIcon({ className: c.kind === 'zone' ? 'plabel zl' : 'plabel', iconSize: [0, 0], html: `<div class="in"><b>${esc(name)}</b><span>${esc(val)}</span></div>` }) }).addTo(labelLayer);

    .filter(x => x.v != null).sort((a, b) => b.v - a.v);

  }
}

// ---------- SVG charts ----------
// Axis labels: big numbers shortened (1,033,268 ֏ -> 1.0M ֏; 845,000 -> 845k), keeping the unit
function shortNum(text, v) {
  const a = Math.abs(v);
  if (a < 10000) return text;
  const unit = text.includes('֏') ? ' ֏' : '', pre = text.startsWith('$') ? '$' : '';
  return pre + (a >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : Math.round(v / 1e3) + 'k') + unit;
}
let chartN = 0;
const CHARTS = {};
function chart(series, fmt, bars = false, big = false) {
  const pts = Object.entries(series || {}).filter(([, v]) => v != null && !isNaN(v)).sort();
  if (pts.length < 2) return '<p class="note">Not enough history yet.</p>';
  const id = 'ch' + (++chartN);
  const W = big ? 640 : 340, H = big ? 250 : 150, L0 = big ? 58 : 4, R0 = 8, T0 = 12, B0 = 24;
  const toIdx = ym => +ym.slice(0, 4) * 12 + +ym.slice(5, 7) - 1;
  const x0 = toIdx(pts[0][0]), x1 = toIdx(pts[pts.length - 1][0]);
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (bars) lo = Math.min(0, lo);
  const pad = (hi - lo) * .08 || Math.abs(hi) * .05 || 1; if (!bars) lo -= pad; hi += pad;
  const X = ym => L0 + (bars ? .5 : 0) * (W - L0 - R0) / Math.max(1, x1 - x0 + 1) + (toIdx(ym) - x0) / Math.max(1, x1 - x0 + (bars ? 1 : 0)) * (W - L0 - R0);
  const Y = v => T0 + (1 - (v - lo) / (hi - lo)) * (H - T0 - B0);
  let body = '';
  if (bars) {
    const slots = pts.every(([k]) => k.endsWith('-12')) ? (x1 - x0) / 12 + 1 : x1 - x0 + 1;   // yearly data: one slot per year
    const bw = Math.max(1.5, Math.min((W - L0 - R0) / slots * .6, ((W - L0 - R0) / Math.max(1, x1 - x0 + 1)) * 12 * .6));
    body = pts.map(([ym, v]) => `<rect x="${(X(ym) - bw / 2).toFixed(1)}" y="${Y(Math.max(v, 0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(.5, Math.abs(Y(v) - Y(0))).toFixed(1)}" fill="#56b0a0" rx="1"/>`).join('');
  } else {
    // a gap is a jump bigger than the series' usual spacing (monthly data: > 3 months; yearly data: > 18 months)
    const steps = pts.slice(1).map(([ym], i) => toIdx(ym) - toIdx(pts[i][0])).sort((a, b) => a - b);
    const gap = Math.max(3, (steps[Math.floor(steps.length / 2)] || 1) * 1.5);
    let d = '', prev = null;
    for (const [ym, v] of pts) { d += (prev != null && toIdx(ym) - prev <= gap ? 'L' : 'M') + X(ym).toFixed(1) + ' ' + Y(v).toFixed(1); prev = toIdx(ym); }
    const lone = pts.filter(([ym], i) => !(i > 0 && toIdx(ym) - toIdx(pts[i - 1][0]) <= gap) && !(i < pts.length - 1 && toIdx(pts[i + 1][0]) - toIdx(ym) <= gap));
    body = `<path d="${d}" fill="none" stroke="#126b60" stroke-width="${big ? 2.4 : 2}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` +
      lone.map(([ym, v]) => `<circle cx="${X(ym).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.8" fill="#126b60"/>`).join('');
    if (lo < 0 && hi > 0) body = `<line x1="${L0}" x2="${W - R0}" y1="${Y(0)}" y2="${Y(0)}" stroke="#9ca3af"/>` + body;
  }
  // gridlines and labels: 4 levels on the left, years along the bottom
  let axis = '';
  if (big) {
    for (let i = 0; i <= 3; i++) {
      const v = lo + (hi - lo) * i / 3, y = Y(v);
      axis += `<line x1="${L0}" x2="${W - R0}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#eef0f3"/><text x="${L0 - 6}" y="${(y + 4).toFixed(1)}" font-size="11" fill="#6b7280" text-anchor="end">${esc(shortNum(fmt(v), v))}</text>`;
    }
    const y0 = +pts[0][0].slice(0, 4), y1 = +pts[pts.length - 1][0].slice(0, 4), step = Math.max(1, Math.ceil((y1 - y0 + 1) / 8));
    for (let y = y0; y <= y1; y += step) { const ym = (y + '-01') > pts[0][0] ? y + '-01' : pts[0][0]; axis += `<text x="${X(ym).toFixed(1)}" y="${H - 6}" font-size="11" fill="#6b7280" text-anchor="middle">${y}</text>`; }
  } else {
    axis = `<line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#e5e7eb"/>
      <text x="${L0}" y="${H - 6}" font-size="11" fill="#6b7280">${pts[0][0].slice(0, 4)}</text><text x="${W - R0}" y="${H - 6}" font-size="11" fill="#6b7280" text-anchor="end">${pts[pts.length - 1][0].slice(0, 4)}</text>
      <text x="${L0 + 2}" y="${T0 + 2}" font-size="11" fill="#6b7280">${esc(fmt(hi))}</text>`;
  }
  const yearlyPts = pts.every(([k]) => k.endsWith('-12'));
  CHARTS[id] = { pts, fmt, X, Y, W, yearlyPts };
  const label = ym => yearlyPts ? ym.slice(0, 4) : monthLabel(ym);
  return `<svg class="chart${big ? ' big' : ''}" id="${id}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Chart">${axis}${body}<line class="cur" x1="0" x2="0" y1="${T0}" y2="${H - B0}" stroke="#9ca3af" stroke-dasharray="2 2" visibility="hidden"/><circle class="dot" r="4" fill="#126b60" stroke="#fff" stroke-width="1.5" visibility="hidden"/></svg>
    <div class="chart-tip" id="${id}t">Latest: <b>${esc(label(pts[pts.length - 1][0]))}</b> · ${esc(fmt(pts[pts.length - 1][1]))} <span style="opacity:.7">· move over the chart to read any point</span></div>`;
}
function wireCharts() {
  for (const [id, c] of Object.entries(CHARTS)) {
    const svg = document.getElementById(id); if (!svg) { delete CHARTS[id]; continue; }
    const tip = document.getElementById(id + 't');
    const show = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      const sx = x / r.width * c.W;
      let best = c.pts[0], bd = Infinity;
      for (const p of c.pts) { const d = Math.abs(c.X(p[0]) - sx); if (d < bd) { bd = d; best = p; } }
      const cur = svg.querySelector('.cur'), dot = svg.querySelector('.dot');
      cur.setAttribute('x1', c.X(best[0])); cur.setAttribute('x2', c.X(best[0])); cur.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', c.X(best[0])); dot.setAttribute('cy', c.Y(best[1])); dot.setAttribute('visibility', 'visible');
      tip.innerHTML = `<b>${esc(c.yearlyPts ? best[0].slice(0, 4) : monthLabel(best[0]))}</b> · ${esc(c.fmt(best[1]))}`;
    };
    svg.addEventListener('mousemove', show); svg.addEventListener('touchmove', show, { passive: true });
    delete CHARTS[id];
  }
}

// ---------- remembered view (this browser only) ----------
function saveState() {
  try { localStorage.setItem('oha-armenia', JSON.stringify({ metric: ui.metric, cur: ui.cur, open: [...ui.open], level: ui.level })); } catch (e) { }
  const q = new URLSearchParams();
  if (ui.metric !== 'price') q.set('m', ui.metric);
  if (levelsFor(ui.metric).length > 1 && curLevel() !== levelsFor(ui.metric)[0]) q.set('l', curLevel());
  if (ui.cur !== 'AMD') q.set('c', ui.cur);
  if (ui.sel) q.set('p', ui.sel.kind + ':' + ui.sel.id);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
}
function loadState() {
  const LV = ['marz', 'district', 'town', 'zone'];
  try { const s = JSON.parse(localStorage.getItem('oha-armenia') || '{}'); if (M[s.metric]) ui.metric = s.metric; if (s.metric === 'zone_price') { ui.metric = 'price'; ui.level = 'zone'; } if (LV.includes(s.level)) ui.level = s.level; if (s.cur === 'USD') ui.cur = 'USD'; if (Array.isArray(s.open)) ui.open = new Set(s.open); } catch (e) { }
  const q = new URLSearchParams(location.search);
  if (M[q.get('m')]) ui.metric = q.get('m');
  if (q.get('m') === 'zone_price') { ui.metric = 'price'; ui.level = 'zone'; }   // old links to the zone map
  if (LV.includes(q.get('l'))) ui.level = q.get('l');
  if (q.get('c') === 'USD') ui.cur = 'USD';
  if (q.get('c') === 'AMD') ui.cur = 'AMD';
  const p = (q.get('p') || '').split(':');
  if (p.length === 2) {
    const ok = p[0] === 'national' || (p[0] === 'district' && D.districts[p[1]]) || (p[0] === 'town' && D.towns[p[1]]) || (p[0] === 'marz' && D.marzes[p[1]]);
    if (ok) ui.sel = { kind: p[0], id: p[1] };
  }
  ui.open.add(M[ui.metric].group);   // the group holding the chosen data point starts open
  document.querySelectorAll('#cur button').forEach(x => x.classList.toggle('on', x.dataset.c === ui.cur));
}

// ---------- start ----------
// 'no-cache' = always check for a newer file (cheap: unchanged files aren't downloaded again)
Promise.all([fetch('data/armenia.json', { cache: 'no-cache' }).then(r => r.json()), fetch('data/areas.geojson').then(r => r.json()),
  fetch('data/yerevan_zones.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null)])
  .then(([data, areas, zones]) => {
    D = data; AREAS = areas;
    ZONES = zones && { ...zones, features: zones.features.filter(f => f.geometry?.coordinates?.some(p => p.length && p[0].length > 3)) };
    // transaction tables can be a month behind the prices (some reports have them only as pictures)
    D.deals_month = lastKey(D.national.deals) || D.latest_month;
    loadState();
    $('#built').textContent = `Prices through ${monthLabel(D.latest_month)}; updated ${D.built}.`;
    $('#asof').textContent = `Updated ${D.built}`;
    renderMetrics();
    initMap();
    restyle();
    if (ui.sel) ui.sel.kind === 'national' ? renderDetail() : select(ui.sel.kind, ui.sel.id, true);
    $('#loading').remove();
  })
  .catch(err => { $('#loading').textContent = 'The Armenia data could not be loaded. Please try again later.'; console.error(err); });
