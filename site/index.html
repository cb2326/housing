<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Housing Map</title>
<meta name="description" content="US housing market map: home values, forecasts, inventory, rents, income and population by state, metro and county.">
<meta name="theme-color" content="#1f5a52">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f5a52'/%3E%3Cpath d='M14 34 32 18l18 16v14a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2z' fill='%23f6efe3'/%3E%3Cpath d='M26 50V38h12v12' fill='%23d9774f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f4efe6; --panel: #fffcf6; --panel-2: #f6f0e5; --line: #e4dacb; --text: #24211c; --muted: #7a7265;
    --accent: #1f5a52; --accent-soft: #e2eeea; --warm: #c8623c; --shadow: 0 10px 30px -14px rgba(50, 40, 20, .35);
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --na: #d9d4ca;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15140f; --panel: #1f1d18; --panel-2: #29261f; --line: #3a352c; --text: #efe8dc; --muted: #a59b8b;
      --accent: #74c3b0; --accent-soft: #223731; --warm: #e58c66; --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7); --na: #3b3830;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100dvh; }

  /* ---------- sidebar: data points ---------- */
  .side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 { margin: 0; font: 600 21px/1.1 var(--serif); }
  .brand small { display: block; color: var(--muted); font: 12px var(--sans); margin-top: 2px; }
  .dp-search { margin: 4px 14px 10px; position: relative; }
  .dp-search input { width: 100%; padding: 8px 12px 8px 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .dp-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .groups { overflow-y: auto; flex: 1; padding: 0 8px 16px; }
  .group { border-top: 1px solid var(--line); }
  .group > button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 12px 8px; cursor: pointer; font-weight: 600; text-align: left; }
  .group > button::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
  .group.open > button::after { transform: rotate(-135deg); }
  .group ul { list-style: none; margin: 0 0 8px; padding: 0; display: none; }
  .group.open ul { display: block; }
  .metric { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .metric:hover { background: var(--accent-soft); }
  .metric input { accent-color: var(--accent); margin: 0; flex: none; }
  .metric span { flex: 1; }
  .metric.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .metric .info { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font: 600 11px/16px var(--serif); text-align: center; background: var(--panel); }
  .metric .info:hover { color: var(--accent); border-color: var(--accent); }
  .side-foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .side-foot a { color: inherit; }

  /* ---------- map + floating controls ---------- */
  .stage { position: relative; min-width: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font: inherit; background: var(--bg); }
  .topbar { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 500; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .place-search { position: relative; flex: 1 1 320px; max-width: 520px; }
  .place-search input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
  .place-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .place-search > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: none; }
  .results.show { display: block; }
  .results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 9px 14px; border: 0; background: none; cursor: pointer; text-align: left; }
  .results button:hover, .results button.sel { background: var(--accent-soft); }
  .results small { color: var(--muted); text-transform: capitalize; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .pill-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 14px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow); display: inline-flex; gap: 7px; align-items: center; }
  .pill-btn.on { border-color: var(--accent); color: var(--accent); }
  .pill-btn svg { width: 16px; height: 16px; }
  .menu-btn { display: none; }

  .legend { position: absolute; right: 14px; bottom: 22px; z-index: 500; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 8px; box-shadow: var(--shadow); width: 300px; max-width: calc(100% - 28px); }
  .legend h3 { margin: 0 0 2px; font: 600 15px var(--serif); }
  .legend .asof { color: var(--muted); font-size: 11.5px; margin-bottom: 8px; }
  .legend .bar { display: flex; gap: 2px; }
  .legend .bar i { flex: 1; height: 12px; }
  .legend .bar i:first-child { border-radius: 4px 0 0 4px; } .legend .bar i:last-child { border-radius: 0 4px 4px 0; }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .legend .na { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend .na i { width: 12px; height: 12px; border-radius: 3px; background: var(--na); }

  .tip { position: absolute; z-index: 600; pointer-events: none; background: #1d1b17; color: #f4eee4; border-radius: 10px; padding: 9px 11px; font-size: 12.5px; min-width: 190px; box-shadow: 0 10px 24px rgba(0, 0, 0, .3); display: none; }
  .tip b { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .tip .row span:first-child { color: #c9c0b2; }
  .tip .hint { color: #a59b8b; font-size: 11px; margin-top: 5px; font-style: italic; }

  /* ---------- detail drawer ---------- */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; z-index: 700; background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .drawer header h2 { margin: 0; font: 600 22px/1.15 var(--serif); flex: 1; }
  .drawer header small { display: block; color: var(--muted); font: 12.5px var(--sans); margin-top: 3px; }
  .x { border: 0; background: var(--panel-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; flex: none; }
  .drawer .body { overflow-y: auto; padding: 14px 18px 24px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .kpi { background: var(--panel-2); border-radius: 12px; padding: 9px 11px; }
  .kpi span { display: block; color: var(--muted); font-size: 11.5px; }
  .kpi b { font: 600 18px var(--serif); font-variant-numeric: tabular-nums; }
  .kpi em { font-style: normal; font-size: 12px; margin-left: 4px; }
  .up { color: #2e7d4f; } .down { color: #b4452f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .up { color: #84cf9c; } :root:not([data-theme="light"]) .down { color: #ec8a71; } }
  .chart-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chart-tabs button, .ranges button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chart-tabs button.on, .ranges button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ranges { display: flex; gap: 4px; justify-content: flex-end; margin-bottom: 4px; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .ctip { position: absolute; pointer-events: none; background: #1d1b17; color: #f4eee4; font-size: 12px; padding: 5px 8px; border-radius: 7px; white-space: nowrap; display: none; transform: translate(-50%, -110%); font-variant-numeric: tabular-nums; }
  .sec { margin-top: 18px; }
  .sec h4 { margin: 0 0 6px; font: 600 15px var(--serif); }
  .sec table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sec td { padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .sec td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .sec tr.cur td { color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* ---------- table view ---------- */
  .table-view { position: absolute; inset: 72px 14px 14px; z-index: 650; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: none; flex-direction: column; overflow: hidden; }
  .table-view.show { display: flex; }
  .tv-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tv-head h3 { margin: 0; font: 600 17px var(--serif); flex: 1; }
  .tv-head input { padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 220px; max-width: 100%; }
  .tv-scroll { overflow: auto; flex: 1; }
  .tv-scroll table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tv-scroll th { position: sticky; top: 0; background: var(--panel-2); text-align: right; padding: 8px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; border-bottom: 1px solid var(--line); }
  .tv-scroll th:first-child, .tv-scroll td:first-child { text-align: left; }
  .tv-scroll th.sorted { color: var(--accent); }
  .tv-scroll td { padding: 7px 12px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tv-scroll tr:hover td { background: var(--accent-soft); cursor: pointer; }
  .tv-scroll td.rank { color: var(--muted); width: 1%; }
  .tv-foot { padding: 8px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  .info-pop { position: fixed; z-index: 900; max-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 12.5px; display: none; }
  .loading { position: absolute; inset: 0; z-index: 800; display: grid; place-items: center; background: var(--bg); color: var(--muted); font: 16px var(--serif); }
  .leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }
  .leaflet-control-zoom a { background: var(--panel); color: var(--text); border-color: var(--line) !important; }

  /* ---------- phones ---------- */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(320px, 88vw); transform: translateX(-102%); transition: transform .22s; box-shadow: var(--shadow); z-index: 900; }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; }
    .topbar { top: 10px; left: 10px; right: 10px; gap: 8px; }
    .place-search { flex-basis: 100%; max-width: none; order: -1; }
    .seg button { padding: 6px 10px; font-size: 13px; }
    .pill-btn { padding: 8px 12px; font-size: 13px; }
    .legend { left: 10px; right: 10px; bottom: 12px; width: auto; }
    .drawer { width: 100%; top: 42%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(102%); }
    .drawer.open { transform: none; }
    .drawer header { padding: 12px 16px 10px; }
    .drawer header h2 { font-size: 19px; }
    .table-view { inset: 120px 8px 8px; }
    .leaflet-control-zoom { display: none; }
  }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .3); z-index: 850; }
  .scrim.show { display: block; }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Data points">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1f5a52"/><path d="M14 34 32 18l18 16v14a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2z" fill="#f6efe3"/><path d="M26 50V38h12v12" fill="#d9774f"/></svg>
      <div><h1>Housing Map</h1><small id="asof">Loading data…</small></div>
    </div>
    <label class="dp-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="dpSearch" type="search" placeholder="Search data points" aria-label="Search data points"></label>
    <div class="groups" id="groups"></div>
    <div class="side-foot">Data: Zillow Research, Realtor.com, U.S. Census Bureau, Freddie Mac (via FRED). Updated monthly. Personal use; not financial advice.</div>
  </aside>
  <main class="stage">
    <div id="map"></div>
    <div class="topbar">
      <button class="pill-btn menu-btn" id="menuBtn" type="button" aria-label="Data points"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Data</button>
      <div class="place-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="placeSearch" type="search" placeholder="Search a state, metro or county" autocomplete="off" aria-label="Search places">
        <div class="results" id="results"></div>
      </div>
      <div class="seg" id="levels" role="tablist" aria-label="Map level">
        <button data-level="state" type="button">State</button><button data-level="metro" type="button">Metro</button><button data-level="county" type="button" class="on">County</button>
      </div>
      <button class="pill-btn" id="tableBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Table</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
    <section class="table-view" id="tableView" aria-label="Table view">
      <div class="tv-head"><h3 id="tvTitle"></h3><input id="tvFilter" type="search" placeholder="Filter places"><button class="x" id="tvClose" type="button" aria-label="Close table">✕</button></div>
      <div class="tv-scroll" id="tvScroll"></div>
      <div class="tv-foot" id="tvFoot"></div>
    </section>
    <aside class="drawer" id="drawer" aria-label="Place details">
      <header><h2 id="dTitle"></h2><button class="x" id="dClose" type="button" aria-label="Close">✕</button></header>
      <div class="body" id="dBody"></div>
    </aside>
    <div class="loading" id="loading">Loading the map…</div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="info-pop" id="infoPop"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// ---------- data points ----------
// fmt: usd, pct (already in %), num, ratio, days. div: diverging scale centred on 0 (else light-to-dark).
const M = {
  hv:            { l: 'Home Value', f: 'usd', i: 'Typical home value (Zillow Home Value Index, mid-tier homes).', s: 'hv' },
  hv_yoy:        { l: 'Home Value Growth (YoY)', f: 'pct', d: 1, i: 'Change in typical home value over the last 12 months.', s: 'hv' },
  hv_mom:        { l: 'Home Value Growth (MoM)', f: 'pct2', d: 1, i: 'Change in typical home value over the last month.', s: 'hv' },
  hv_5y:         { l: 'Home Value Growth (5-Year)', f: 'pct', d: 1, i: 'Change in typical home value over the last 5 years.', s: 'hv' },
  fc_1y:         { l: 'Home Price Forecast (1-Year)', f: 'pct', d: 1, i: "Zillow's forecast for home values 12 months ahead. Published for metros; counties show their metro's forecast.", s: 'hv' },
  overvalued:    { l: 'Overvalued %', f: 'pct', d: 1, i: "How far today's home value sits above (+) or below (−) its long-term 2000–2019 trend line, extended to today. A rough gauge, not a prediction.", s: 'hv' },
  from_2022_peak:{ l: '% Change from 2022 Peak', f: 'pct', d: 1, i: "Today's home value compared with its highest month in 2022.", s: 'hv' },
  crash_2007:    { l: '% Crash 2007–12', f: 'pct', d: 1, i: 'Drop from the 2005–08 peak to the 2008–13 low during the last housing crash.', s: 'hv' },
  hv_income:     { l: 'Home Value / Income', f: 'ratio', i: 'Typical home value divided by median household income. Around 3 to 4 has historically been considered affordable.', s: 'hv' },
  mtg_pmt:       { l: 'Mortgage Payment', f: 'usd', i: 'Monthly principal and interest on the typical home: 20% down, 30-year fixed at the current national rate. Taxes and insurance not included.', s: 'hv' },
  mtg_pct_income:{ l: 'Mortgage Payment % of Income', f: 'pct', i: 'The mortgage payment above as a share of median household income.', s: 'hv' },
  salary_needed: { l: 'Salary to Afford a House', f: 'usd', i: 'Yearly income at which the mortgage payment above is 30% of gross pay.', s: 'hv' },
  buy_vs_rent:   { l: 'Buy vs Rent Differential', f: 'usd', d: 1, i: 'Mortgage payment minus typical rent, per month. Positive means owning costs more than renting.', s: 'rent' },
  inv:           { l: 'For Sale Inventory', f: 'num', i: 'Active listings for sale (Realtor.com).', s: 'inv' },
  inv_yoy:       { l: 'Inventory Growth (YoY)', f: 'pct', d: 1, i: 'Change in active listings versus the same month last year.', s: 'inv' },
  inv_vs_2019:   { l: 'Inventory vs Pre-Pandemic', f: 'pct', d: 1, i: 'Active listings compared with the same month in 2017–2019. Negative means a shortage versus normal.', s: 'inv' },
  newl:          { l: 'New Listing Count', f: 'num', i: 'Homes newly listed for sale this month.', s: 'newl' },
  newl_yoy:      { l: 'New Listings (YoY)', f: 'pct', d: 1, i: 'Change in new listings versus the same month last year.', s: 'newl' },
  dom:           { l: 'Days on Market', f: 'days', i: 'Median days homes stay listed (Realtor.com).', s: 'dom' },
  dom_yoy:       { l: 'Days on Market (YoY)', f: 'pct', d: 1, i: 'Change in median days on market versus a year ago.', s: 'dom' },
  cut:           { l: 'Price Cut %', f: 'pct', i: 'Share of active listings with a price reduction this month.', s: 'cut' },
  lp:            { l: 'Median Listing Price', f: 'usd', i: 'Median asking price of active listings.', s: 'lp' },
  lp_yoy:        { l: 'Median Listing Price (YoY)', f: 'pct', d: 1, i: 'Change in median asking price versus a year ago.', s: 'lp' },
  months_supply: { l: 'Listings per Pending Sale', f: 'ratio', i: 'Active listings divided by pending sales: a rough months-of-supply gauge. Higher favours buyers.', s: 'inv' },
  rent:          { l: 'Typical Rent', f: 'usd', i: 'Typical asking rent (Zillow Observed Rent Index, all rentals).', s: 'rent' },
  rent_yoy:      { l: 'Rent Growth (YoY)', f: 'pct', d: 1, i: 'Change in typical rent over the last 12 months.', s: 'rent' },
  price_rent:    { l: 'Home Value to Rent Ratio', f: 'ratio', i: 'Home value divided by a year of rent. Higher means buying is expensive relative to renting.', s: 'rent' },
  gross_yield:   { l: 'Gross Rental Yield', f: 'pct2', i: 'A year of typical rent as a share of home value, before costs (a rough cap-rate stand-in).', s: 'rent' },
  rent_pct_income:{ l: 'Rent as % of Income', f: 'pct', i: 'A year of typical rent as a share of median household income.', s: 'rent' },
  income:        { l: 'Median Household Income', f: 'usd', i: 'Census Small Area Income & Poverty Estimates. Metros are a population-weighted blend of their counties.', s: 'hv' },
  poverty:       { l: 'Poverty Rate', f: 'pct', i: 'Share of people below the poverty line (Census SAIPE).', s: 'hv' },
  pop:           { l: 'Population', f: 'num', i: 'Census population estimate (July of the latest year).', s: 'hv' },
  pop_growth:    { l: 'Population Growth (1-Year)', f: 'pct2', d: 1, i: 'Population change over the latest year.', s: 'hv' },

const GROUPS = [

  ['Home Price & Affordability', ['hv', 'hv_yoy', 'hv_mom', 'hv_5y', 'fc_1y', 'overvalued', 'from_2022_peak', 'crash_2007', 'hv_income', 'mtg_pmt', 'mtg_pct_income', 'salary_needed', 'buy_vs_rent']],

  ['Rent & Investing', ['rent', 'rent_yoy', 'price_rent', 'gross_yield', 'rent_pct_income', 'buy_vs_rent']],
  ['Income & Population', ['income', 'poverty', 'pop', 'pop_growth', 'pop_growth_5y', 'births_pct', 'deaths_pct', 'natural_pct', 'dom_mig_pct', 'intl_mig_pct']],
];

// Colour ramps: one hue light-to-dark for amounts,

const SEQ = ['#e3efe9', '#bddbd0', '#93c3b4', '#66a898', '#3f8b7c', '#256e62', '#14504a'];
const DIV = ['#2f5f93', '#6890c2', '#b3c8e2', '#e9e5dc', '#f0bf9f', '#d97a52', '#a3432a'];

// ---------- formatting ----------
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
function fmt(v, f, short) {
  if (v == null || !isFinite(v)) return '—';
  const sign = v < 0 ? '−' : '';
  const a = Math.abs(v);
  switch (f) {
    case 'usd': return sign + '$' + (short && a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : short && a >= 1e4 ? Math.round(a / 1e3) + 'K' : nf0.format(a));
    case 'pct': return sign + a.toFixed(1) + '%';
    case 'pct2': return sign + a.toFixed(2) + '%';
    case 'share': return (v * 100).toFixed(1) + '%';
    case 'ratio': return sign + a.toFixed(1) + '×';
    case 'days': return nf0.format(v) + ' days';
    default: return sign + (short && a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : short && a >= 1e4 ? Math.round(a / 1e3) + 'K' : nf0.format(a));

}
const signed = (v, f) => v == null ? '—' : (v > 0 ? '+' : '') + fmt(v, f);

// ---------- colour scale ----------
function quantile(sorted, p) {
  if (!sorted.length) return 0;
  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
function niceRound(v) {

  const a = Math.abs(v), p = Math.pow(10, Math.floor(Math.log10(a)) - 1);

}
function buildScale() {
  const key = ui.metric, def = M[key];
  const vals = Object.values(D[ui.level]).map(p => p.v[key]).filter(v => v != null && isFinite(v)).sort((a, b) => a - b);
  let breaks;
  if (def.d) {
    const abs = vals.map(Math.abs).sort((a, b) => a - b);
    const t = [0.2, 0.5, 0.8].map(p => niceRound(quantile(abs, p)));
    for (let i = 1; i < 3; i++) if (t[i] <= t[i - 1]) t[i] = t[i - 1] * 1.5 || 1;
    breaks = [-t[2], -t[1], -t[0], t[0], t[1], t[2]];
  } else {
    breaks = [1, 2, 3, 4, 5, 6].map(i => niceRound(quantile(vals, i / 7)));
    for (let i = 1; i < breaks.length; i++) if (breaks[i] <= breaks[i - 1]) breaks[i] = breaks[i - 1] + Math.abs(breaks[i - 1] || 1) * 0.01;
  }

}
function colorFor(v) {

  while (i < scale.breaks.length && v >= scale.breaks[i]) i++;
  return scale.colors[i];
}
function renderLegend() {
  const def = M[ui.metric], f = def.f === 'pct2' ? 'pct' : def.f;
  const meta = D.meta || { months: {} };
  const src = ['inv', 'inv_yoy', 'inv_vs_2019', 'newl', 'newl_yoy', 'dom', 'dom_yoy', 'cut', 'lp', 'lp_yoy', 'months_supply'].includes(ui.metric) ? `Realtor.com, ${ymLabel(meta.months.realtor)}`
    : ['income', 'poverty'].includes(ui.metric) ? `Census, ${meta.months.income}`
    : ui.metric.startsWith('pop') || ui.metric.endsWith('_pct') && !['mtg_pct_income', 'rent_pct_income'].includes(ui.metric) ? `Census, ${meta.months.population}`
    : ui.metric === 'fc_1y' ? `Zillow forecast from ${ymLabel(meta.months.zillow)}`
    : `Zillow, ${ymLabel(meta.months.zillow)}${['mtg_pmt', 'mtg_pct_income', 'salary_needed', 'buy_vs_rent'].includes(ui.metric) ? ` · rate ${meta.mortgage ? meta.mortgage.rate : ''}%` : ''}`;
  const ticks = [scale.breaks[0], def.d ? 0 : scale.breaks[Math.floor(scale.breaks.length / 2)], scale.breaks[scale.breaks.length - 1]];
  document.getElementById('legend').innerHTML = `<h3>${esc(def.l)}</h3><div class="asof">${esc(src)} · ${scale.count} ${ui.level === 'county' ? 'counties' : ui.level === 'metro' ? 'metros' : 'states'}</div>
    <div class="bar">${scale.colors.map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <div class="ticks"><span>&lt; ${fmt(ticks[0], f, true)}</span><span>${fmt(ticks[1], f, true)}</span><span>&gt; ${fmt(ticks[2], f, true)}</span></div>
    <div class="na"><i></i>No data</div>`;
}

// ---------- map ----------
function styleFor(level, id) {

const dark = () => matchMedia('(prefers-color-scheme: dark)').matches;
function restyle() {

const tip = document.getElementById('tip');
function showTip(e, level, id) {

  const v = p.v, k = ui.metric;
  const extra = ['hv', 'hv_yoy', 'inv_yoy', 'dom'].filter(x => x !== k).slice(0, 3);
  tip.innerHTML = `<b>${esc(placeName(level, p))}</b>
    <div class="row"><span>${esc(M[k].l)}</span><span>${M[k].d ? signed(v[k], M[k].f) : fmt(v[k], M[k].f)}</span></div>
    ${extra.map(x => `<div class="row"><span>${esc(M[x].l)}</span><span>${M[x].d ? signed(v[x], M[x].f) : fmt(v[x], M[x].f)}</span></div>`).join('')}
    <div class="hint">Click for history and every data point</div>`;
  tip.style.display = 'block';
  const r = document.querySelector('.stage').getBoundingClientRect();
  let x = e.originalEvent.clientX - r.left + 14, y = e.originalEvent.clientY - r.top + 14;
  if (x + tip.offsetWidth > r.width - 8) x -= tip.offsetWidth + 28;

}
const placeName = (level, p) => level === 'county' ? `${p.n}, ${p.s}` : p.n;

function makeLayer(level, features) {
  return L.geoJSON(features, {
    style: f => styleFor(level, f.id),
    onEachFeature: (f, l) => {
      l.on('mousemove', e => { if (matchMedia('(hover: hover)').matches) showTip(e, level, f.id); l.setStyle({ weight: 2.2, color: '#24211c' }); l.bringToFront(); });
      l.on('mouseout', () => { tip.style.display = 'none'; l.setStyle(styleFor(level, f.id)); if (layers.stateLines) layers.stateLines.bringToFront(); });
      l.on('click', () => { tip.style.display = 'none'; openDetail(level, dataId(level, f.id)); });
    },
  });

async function init() {
  map = L.map('map', { zoomControl: true, preferCanvas: true, minZoom: 3, maxZoom: 10, zoomSnap: 0.25, worldCopyJump: false }).setView([38.5, -96], 4.4);
  map.zoomControl.setPosition('bottomleft');
  map.createPane('labels'); map.getPane('labels').style.zIndex = 650; map.getPane('labels').style.pointerEvents = 'none';
  // Background: Esri's gray canvas (no key needed), with its place-name layer drawn above the coloured areas.
  const tone = dark() ? 'Dark' : 'Light';
  const esri = name => `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${tone}_Gray_${name}/MapServer/tile/{z}/{y}/{x}`;
  L.tileLayer(esri('Base'), { attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors', maxNativeZoom: 16 }).addTo(map);
  L.tileLayer(esri('Reference'), { pane: 'labels', maxNativeZoom: 16 }).addTo(map);
  if (innerWidth < 820) map.setView([39, -97], 3.4);

  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  try {
    [topo, D.meta, D.state, D.metro, D.county] = await Promise.all([
      get('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/counties-10m.json'), get('data/meta.json'), get('data/state.json'), get('data/metro.json'), get('data/county.json')]);
  } catch (e) {
    document.getElementById('loading').textContent = 'Couldn’t load the data. Check your connection and refresh.';
    return;
  }
  document.getElementById('asof').textContent = `Updated ${D.meta.built.slice(0, 10)}`;

  const counties = topojson.feature(topo, topo.objects.counties).features;
  const states = topojson.feature(topo, topo.objects.states).features;
  // Metros are drawn by merging their counties' shapes.
  const geomById = {};
  topo.objects.counties.geometries.forEach(g => { geomById[g.id] = g; });
  const metroOf = {};
  for (const [fips, p] of Object.entries(D.county)) if (p.m) metroOf[fips] = p.m;
  for (const [old, neu] of Object.entries(CT_OLD_TO_NEW)) if (metroOf[neu]) metroOf[old] = metroOf[neu];
  const groups = {};
  for (const id in geomById) if (metroOf[id]) (groups[metroOf[id]] ||= []).push(geomById[id]);
  const metros = Object.entries(groups).filter(([id]) => D.metro[id]).map(([id, gs]) => ({ type: 'Feature', id, properties: {}, geometry: topojson.merge(topo, gs) }));

  layers.metro = makeLayer('metro', metros);

  layers.stateLines = L.geoJSON(topojson.mesh(topo, topo.objects.states, (a, b) => a !== b), { style: { color: dark() ? '#0d0c09' : '#5b5348', weight: 1, opacity: 0.55, fill: false }, interactive: false }).addTo(map);
  buildSearchIndex();
  renderGroups();
  setLevel(ui.level);
  document.getElementById('loading').remove();
}

// ---------- place search ----------
let index = [];
function buildSearchIndex() {
  index = [];
  for (const level of ['state', 'metro', 'county']) for (const [id, p] of Object.entries(D[level])) {
    index.push({ level, id, label: placeName(level, p), key: placeName(level, p).toLowerCase() });
  }
}
const searchEl = document.getElementById('placeSearch'), resultsEl = document.getElementById('results');
let hits = [], sel = 0;
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  if (q.length < 2) { resultsEl.classList.remove('show'); return; }
  const words = q.split(/\s+/);
  hits = index.filter(x => words.every(w => x.key.includes(w)))
    .sort((a, b) => (b.key.startsWith(q) - a.key.startsWith(q)) || (['state', 'metro', 'county'].indexOf(a.level) - ['state', 'metro', 'county'].indexOf(b.level)) || a.key.length - b.key.length)
    .slice(0, 8);
  sel = 0;
  resultsEl.innerHTML = hits.length ? hits.map((h, i) => `<button type="button" data-i="${i}" class="${i === 0 ? 'sel' : ''}"><span>${esc(h.label)}</span><small>${h.level}</small></button>`).join('') : '<div class="note" style="padding:10px 14px">No matches</div>';
  resultsEl.classList.add('show');
});
searchEl.addEventListener('keydown', e => {
  if (!resultsEl.classList.contains('show') || !hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; resultsEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('sel', i === sel)); }
  if (e.key === 'Enter') { e.preventDefault(); pick(hits[sel]); }
  if (e.key === 'Escape') resultsEl.classList.remove('show');
});
resultsEl.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(hits[+b.dataset.i]); });
document.addEventListener('click', e => { if (!e.target.closest('.place-search')) resultsEl.classList.remove('show'); });
function pick(h) {
  resultsEl.classList.remove('show');
  searchEl.value = h.label;
  searchEl.blur();
  if (ui.level !== h.level) setLevel(h.level);
  zoomTo(h.level, h.id);
  openDetail(h.level, h.id);
}
function zoomTo(level, id) {
  const ids = level === 'county' ? [id, ...Object.keys(CT_OLD_TO_NEW).filter(o => CT_OLD_TO_NEW[o] === id)] : [id];
  let bounds = null;
  layers[level].eachLayer(l => { if (ids.includes(l.feature.id)) bounds = bounds ? bounds.extend(l.getBounds()) : l.getBounds(); });
  if (!bounds) return;
  const wide = innerWidth > 820;
  map.flyToBounds(bounds, { maxZoom: level === 'state' ? 6 : 7.5, paddingTopLeft: [40, wide ? 80 : 120], paddingBottomRight: wide ? [460, 40] : [40, innerHeight * 0.6] });
}

// ---------- detail drawer ----------

// The selected place gets a bold outline on the map.
let selLayer = null;
function outline(level, id) {

  if (!level || !layers[level]) return;
  const ids = level === 'county' ? [id, ...Object.keys(CT_OLD_TO_NEW).filter(o => CT_OLD_TO_NEW[o] === id)] : [id];
  const feats = [];

  document.getElementById('dBody').innerHTML = `
    <div class="kpis">
      ${kpiYoy('hv', 'hv_yoy', 'Home value')}
      ${kpi('fc_1y', '1-year forecast')}
      ${kpiYoy('inv', 'inv_yoy', 'For sale inventory')}
      ${kpiYoy('dom', 'dom_yoy', 'Days on market')}
      ${kpi('cut', 'Price cut %')}
      ${kpiYoy('rent', 'rent_yoy', 'Typical rent')}
    </div>
    <div class="chart-tabs">${hist == null ? '<span class="note">Loading history…</span>' : avail.map(k => `<button type="button" class="${k === chartKey ? 'on' : ''}" data-series="${k}">${SERIES[k][0]}</button>`).join('')}</div>
    ${hist && hist[chartKey] ? `<div class="ranges">${[['all', 'All'], ['10', '10Y'], ['5', '5Y'], ['1', '1Y']].map(([r, l]) => `<button type="button" class="${chartRange === r ? 'on' : ''}" data-range="${r}">${l}</button>`).join('')}</div><div class="chart" id="chart">${chartSvg(hist[chartKey], SERIES[chartKey][1])}<div class="ctip"></div></div>` : ''}
    ${groupsHtml}
    <p class="note">Home values: Zillow (${ymLabel(D.meta.months.zillow)}). Listings: Realtor.com (${ymLabel(D.meta.months.realtor)}). Income &amp; poverty: Census ${D.meta.months.income}; population ${D.meta.months.population}. Mortgage math uses ${D.meta.mortgage.rate}% (30-year fixed, ${esc(D.meta.mortgage.date)}).${level === 'metro' ? ' Metro income and population are combined from their counties.' : ''}</p>`;
}
document.getElementById('dBody').addEventListener('click', e => {
  const s = e.target.closest('[data-series]'); if (s) { chartKey = s.dataset.series; renderDrawer(); return; }
  const r = e.target.closest('[data-range]'); if (r) { chartRange = r.dataset.range; renderDrawer(); }
});

// History chart: one line, hover for the month's value.
function chartSvg(series, f) {
  let keys = Object.keys(series).sort();
  if (chartRange !== 'all') { const cut = `${+keys[keys.length - 1].slice(0, 4) - +chartRange}${keys[keys.length - 1].slice(4)}`; keys = keys.filter(k => k >= cut); }
  if (keys.length < 2) return '<p class="note">Not enough history.</p>';
  const vals = keys.map(k => series[k]);
  const W = 380, H = 190, L0 = 46, R0 = 8, T0 = 10, B0 = 22;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
  if (lo > 0 && lo < (hi - lo) * 0.3) lo = 0;
  const x = i => L0 + (W - L0 - R0) * i / (keys.length - 1), y = v => T0 + (H - T0 - B0) * (1 - (v - lo) / (hi - lo));
  const step = niceStep((hi - lo) / 4);
  const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(t);
  const years = [...new Set(keys.map(k => k.slice(0, 4)))];
  const every = Math.ceil(years.length / 6);
  const xt = keys.map((k, i) => [k, i]).filter(([k]) => k.endsWith('-01') && years.indexOf(k.slice(0, 4)) % every === 0);
  if (keys.length <= 14) xt.splice(0, xt.length, ...keys.map((k, i) => [k, i]).filter((_, i) => i % 3 === 0));
  const path = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = `${path}L${x(vals.length - 1).toFixed(1)},${(H - B0)}L${x(0)},${H - B0}Z`;
  const first = vals[0], last = vals[vals.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(SERIES[chartKey][0])} history" data-keys='${JSON.stringify(keys)}' data-vals='${JSON.stringify(vals)}' data-f="${f}" data-dims='${JSON.stringify({ W, H, L0, R0, T0, B0, lo, hi })}'>
    ${ticks.map(t => `<line x1="${L0}" x2="${W - R0}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L0 - 6}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(t, f, true)}</text>`).join('')}
    ${xt.map(([k, i]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${keys.length <= 14 ? MON[+k.slice(5) - 1] : k.slice(0, 4)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity="0.10"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(last)}" r="4" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>
    <line class="xh" x1="0" x2="0" y1="${T0}" y2="${H - B0}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle class="xd" r="4" fill="var(--warm)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
    <rect x="${L0}" y="${T0}" width="${W - L0 - R0}" height="${H - T0 - B0}" fill="transparent"/>
  </svg><p class="note" style="margin-top:4px">${ymLabel(keys[0])} → ${ymLabel(keys[keys.length - 1])}: ${fmt(first, f)} → ${fmt(last, f)} (${first ? signed((last / first - 1) * 100, 'pct') : '—'})</p>`;
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
document.getElementById('dBody').addEventListener('mousemove', e => {
  const svg = e.target.closest('.chart svg'); if (!svg) return;
  const keys = JSON.parse(svg.dataset.keys), vals = JSON.parse(svg.dataset.vals), d = JSON.parse(svg.dataset.dims), f = svg.dataset.f;
  const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * d.W / r.width;
  const i = Math.max(0, Math.min(keys.length - 1, Math.round((sx - d.L0) / (d.W - d.L0 - d.R0) * (keys.length - 1))));
  const cx = d.L0 + (d.W - d.L0 - d.R0) * i / (keys.length - 1), cy = d.T0 + (d.H - d.T0 - d.B0) * (1 - (vals[i] - d.lo) / (d.hi - d.lo));
  const xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
  xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
  xd.setAttribute('cx', cx); xd.setAttribute('cy', cy); xd.setAttribute('visibility', 'visible');
  const t = svg.parentElement.querySelector('.ctip');
  t.textContent = `${ymLabel(keys[i])}: ${fmt(vals[i], f)}`;
  t.style.display = 'block'; t.style.left = (cx * r.width / d.W) + 'px'; t.style.top = (cy * r.height / d.H) + 'px';
});
document.getElementById('dBody').addEventListener('mouseleave', () => {
  document.querySelectorAll('.chart .ctip').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.chart .xh, .chart .xd').forEach(el => el.setAttribute('visibility', 'hidden'));
}, true);

// ---------- table view ----------
let tableOpen = false, sortKey = null, sortDir = -1;
const TABLE_COLS = ['hv', 'hv_yoy', 'fc_1y', 'inv_yoy', 'dom', 'cut', 'income'];
document.getElementById('tableBtn').addEventListener('click', () => { tableOpen = !tableOpen; document.getElementById('tableView').classList.toggle('show', tableOpen); document.getElementById('tableBtn').classList.toggle('on', tableOpen); if (tableOpen) renderTable(); });
document.getElementById('tvClose').addEventListener('click', () => { tableOpen = false; document.getElementById('tableView').classList.remove('show'); document.getElementById('tableBtn').classList.remove('on'); });
document.getElementById('tvFilter').addEventListener('input', () => renderTable());
function renderTable() {
  const cols = [ui.metric, ...TABLE_COLS.filter(c => c !== ui.metric)];
  const k = sortKey && cols.includes(sortKey) ? sortKey : ui.metric;
  const q = document.getElementById('tvFilter').value.trim().toLowerCase();
  let list = Object.entries(D[ui.level]).map(([id, p]) => ({ id, p, name: placeName(ui.level, p) })).filter(r => !q || r.name.toLowerCase().includes(q));
  list.sort((a, b) => {
    const x = a.p.v[k], y = b.p.v[k];
    if (x == null && y == null) return a.name.localeCompare(b.name);
    if (x == null) return 1; if (y == null) return -1;
    return (x - y) * sortDir;
  });
  const shown = list.slice(0, 400);
  document.getElementById('tvTitle').textContent = `${M[ui.metric].l} · ${ui.level === 'county' ? 'Counties' : ui.level === 'metro' ? 'Metros' : 'States'}`;
  document.getElementById('tvScroll').innerHTML = `<table><thead><tr><th>Place</th>${cols.map(c => `<th data-sort="${c}" class="${c === k ? 'sorted' : ''}">${esc(M[c].l)}${c === k ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>${
    shown.map(r => `<tr data-id="${r.id}"><td>${esc(r.name)}</td>${cols.map(c => `<td>${M[c].d ? signed(r.p.v[c], M[c].f) : fmt(r.p.v[c], M[c].f)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  document.getElementById('tvFoot').textContent = `${list.length} places${list.length > shown.length ? ` · showing the first ${shown.length} (filter to narrow)` : ''} · click a column to sort, a row to open it`;
}
document.getElementById('tvScroll').addEventListener('click', e => {
  const th = e.target.closest('[data-sort]');
  if (th) { if (sortKey === th.dataset.sort) sortDir = -sortDir; else { sortKey = th.dataset.sort; sortDir = -1; } renderTable(); return; }
  const tr = e.target.closest('tr[data-id]');
  if (tr) { zoomTo(ui.level, tr.dataset.id); openDetail(ui.level, tr.dataset.id); }
});

init();
</script>
