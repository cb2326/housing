# Rebuilds the housing data and publishes the map on GitHub Pages.
# Runs on the 5th and 20th of every month (Realtor.com updates early in the month, Zillow mid-month),
# whenever files change, and on demand (Actions tab -> Update housing map -> Run workflow).
name: Update housing map

on:
  schedule:
    - cron: "0 13 5,20 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["last-update.txt", "data_cache/**", "armenia/cache/**"]

permissions:
  contents: write   # to save data_cache/ and last-update.txt back into the repository
  pages: write
  id-token: write
  issues: write     # to open an issue (GitHub emails it to you) when some data needs attention

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and build the data
        env:
          # Optional: a free key from https://api.census.gov/data/key_signup.html, saved as a repository secret
          # (Settings -> Secrets and variables -> Actions -> New repository secret, name CENSUS_API_KEY).
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          # Optional: a free HUD User API token (https://www.huduser.gov/hudapi/public/register), saved the same way,
          # name HUD_API_TOKEN. Adds HUD Fair Market Rents.
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: python build_data.py

      # The Armenia map (openhousingatlas.com/armenia/). Kept apart on purpose: if this step fails, the US map
      # still publishes, and the Armenia page shows its last good data (saved in armenia/cache/).
      - name: Armenia data
        continue-on-error: true
        run: |
          pip install pypdf==7.0.0
          python armenia/build_armenia.py

      - uses: actions/configure-pages@v6

      # The package gets a name per attempt, so "Re-run failed jobs" works: otherwise the re-run finds the first
      # attempt's package too and refuses ("Multiple artifacts named github-pages").
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # GitHub allows a publish at most 10 minutes, and copying the site (~8,000 files) sometimes runs out of time
      # even when nothing is wrong. So a timed-out publish is tried once more automatically.
      - name: Publish
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Publish (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Saves the once-a-year results (data_cache/) so later runs don't work them out again. On scheduled runs it also
      # notes the date: GitHub pauses scheduled jobs in repositories with no activity for 60 days.
      - name: Save yearly data
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then date -u +"%Y-%m-%d %H:%M UTC" > last-update.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data_cache 2>/dev/null || true
          git add armenia/cache 2>/dev/null || true
          git add last-update.txt 2>/dev/null || true
          git commit -m "Save yearly data" || true
          git pull --rebase || true
          git push || true

      # If the data check found something late or a new release that has to be added by hand, post it as an issue.
      # GitHub emails new issues and comments to the repository owner. One open issue is reused for later findings.
      - name: Tell the owner about data that needs attention
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notices.txt ]; then
            title="Data check: something needs attention"
            n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
            if [ -n "$n" ]; then gh issue comment "$n" --body-file notices.txt; else gh issue create --title "$title" --body-file notices.txt; fi
          fi
