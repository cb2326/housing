# Rebuilds the housing data and publishes the map on GitHub Pages.
name: Update housing map

on:
  schedule:
    - cron: "0 13 5,20 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["last-update.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and build the data
        run: python build_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Note the update
        if: github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > last-update.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add last-update.txt
          git commit -m "Monthly data update" || true
          git push || true
