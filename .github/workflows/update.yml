# Rebuilds the housing data and publishes the map on GitHub Pages.
# Runs on the 5th and 20th of every month (Realtor.com updates early in the month, Zillow mid-month),
# whenever files change, and on demand (Actions tab -> Update housing map -> Run workflow).
name: Update housing map

on:
  schedule:
    - cron: "0 13 5,20 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["last-update.txt", "data_cache/**"]

permissions:
  contents: write   # to save data_cache/ and last-update.txt back into the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and build the data
        env:
          # Optional: a free key from https://api.census.gov/data/key_signup.html, saved as a repository secret
          # (Settings -> Secrets and variables -> Actions -> New repository secret, name CENSUS_API_KEY).
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python build_data.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5

      # Saves the once-a-year results (data_cache/) so later runs don't work them out again. On scheduled runs it also
      # notes the date: GitHub pauses scheduled jobs in repositories with no activity for 60 days.
      - name: Save yearly data
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then date -u +"%Y-%m-%d %H:%M UTC" > last-update.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data_cache 2>/dev/null || true
          git add last-update.txt 2>/dev/null || true
          git commit -m "Save yearly data" || true
          git pull --rebase || true
          git push || true
